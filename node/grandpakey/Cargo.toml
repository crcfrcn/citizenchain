[package]
name = "nodegrandpakey"
description = "CitizenChain nodegrandpakey"
publish = false
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
codec = { workspace = true, default-features = true }
ed25519-dalek = "=2.2.0"
grandpakey = { path = "../../runtime/governance/grandpakey", default-features = true }
hex = "=0.4.3"
identity = { path = "../../runtime/misc/identity", default-features = true }
nodeclient = { path = "../client" }
nodecontrol = { path = "../control" }
nodedesktop = { path = "../desktop" }
primitives = { path = "../../runtime/primitives" }
rand = { workspace = true, default-features = true }
runtime = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
sp-consensus-grandpa = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
tauri = { version = "=2.11.5", features = [] }

[features]
