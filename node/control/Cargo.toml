[package]
name = "nodecontrol"
description = "CitizenChain nodecontrol"
publish = false
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
blake2b_simd = "1"
bs58 = "=0.5.1"
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
identity = { path = "../../runtime/misc/identity", default-features = true }
libc = "0.2"
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid"] }
nodeclient = { path = "../client" }
nodedesktop = { path = "../desktop" }
primitives = { path = "../../runtime/primitives" }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
tauri = { version = "=2.11.5", features = [] }
tokio = { workspace = true, default-features = true, features = ["time"] }
zeroize = "=1.9.0"

[features]
