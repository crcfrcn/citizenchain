<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="688" viewBox="0 0 1040 688" role="img" aria-labelledby="title description">
<title id="title">储委会体系与联合投票 / Reserve Committees and Joint Voting</title><desc id="description">1个国家储委会19票，43个省储委会43票，43个省储行43票，共87个机构105票。</desc>
<style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#14324c;text-anchor:middle}.title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:16px}.line{fill:none;stroke:#7597ae;stroke-width:2}.card{fill:#fff;stroke:#b4cbdc;stroke-width:1.5}</style>
<rect width="100%" height="100%" rx="16" fill="#f4f8fb"/>
<text class="title"><tspan x="520" y="42">公民储备委员会联合会议</tspan><tspan x="520" y="74">Citizen Reserve Committee Joint Meeting</tspan></text><rect class="card" x="30" y="119" width="310" height="190" rx="14" style="fill:#fff"/><text class="label"><tspan x="185.0" y="153">国家储委会</tspan><tspan x="185.0" y="179">National Reserve Committee</tspan><tspan x="185.0" y="205">1个机构 / 1 institution</tspan><tspan x="185.0" y="231">19票 / 19 votes</tspan></text><text class="body"><tspan x="185" y="267">内部投票：13 / 19</tspan><tspan x="185" y="291">Internal voting: 13 / 19</tspan></text><rect class="card" x="365" y="119" width="310" height="190" rx="14" style="fill:#fff"/><text class="label"><tspan x="520.0" y="153">省储委会</tspan><tspan x="520.0" y="179">Provincial Reserve Committees</tspan><tspan x="520.0" y="205">43个机构 / 43 institutions</tspan><tspan x="520.0" y="231">每机构1票 / 1 vote each</tspan></text><text class="body"><tspan x="520" y="267">每机构内部投票：6 / 9</tspan><tspan x="520" y="291">Internal voting per institution: 6 / 9</tspan></text><rect class="card" x="700" y="119" width="310" height="190" rx="14" style="fill:#fff"/><text class="label"><tspan x="855.0" y="153">省储行</tspan><tspan x="855.0" y="179">Provincial Reserve Banks</tspan><tspan x="855.0" y="205">43个机构 / 43 institutions</tspan><tspan x="855.0" y="231">每机构1票 / 1 vote each</tspan></text><text class="body"><tspan x="855" y="267">每机构内部投票：6 / 9</tspan><tspan x="855" y="291">Internal voting per institution: 6 / 9</tspan></text><path class="line" d="M185 309V346H855V309M520 309V387"/><rect class="card" x="225" y="387" width="590" height="94" rx="14" style="fill:#e7f3f1"/><text class="label"><tspan x="520.0" y="421">87个治理机构，共105票</tspan><tspan x="520.0" y="447">87 governance institutions, 105 votes</tspan></text><text class="body"><tspan x="520" y="529">105票全票赞成即通过。</tspan><tspan x="520" y="553">All 105 approval votes pass the institutional stage.</tspan></text><text class="body"><tspan x="520" y="595">任一机构否决或30天期满仍未全票通过，进入联合公投。</tspan><tspan x="520" y="619">Any institution’s rejection or failure to reach unanimity within 30 days</tspan><tspan x="520" y="643">advances the proposal to a joint referendum.</tspan></text>
</svg>
