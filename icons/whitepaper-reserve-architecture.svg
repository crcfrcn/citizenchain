<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="844" viewBox="0 0 1040 844" role="img" aria-labelledby="title description"><title id="title">储委会体系与联合投票 / Reserve Committees and Joint Voting</title><desc id="description">87个机构105票：全票通过；否则进入联合公投，按人口快照判定通过或否决。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#14324c;text-anchor:middle}.title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:16px}.line{fill:none;stroke:#7597ae;stroke-width:2}.card{fill:#fff;stroke:#b4cbdc;stroke-width:1.5}</style><rect width="1040" height="844" rx="16" fill="#f4f8fb" /><text x="520" y="36" font-size="26" font-weight="700">公民储备委员会联合会议</text><text x="520" y="65" font-size="24" font-weight="700">Citizen Reserve Committee Joint Meeting</text><rect class="card" x="365" y="90" width="310" height="148" rx="14" style="fill:#fff" /><text x="520.0" y="116" font-size="20" font-weight="600">国家储委会</text><text x="520.0" y="138" font-size="16" font-weight="600">National Reserve Committee</text><text x="520.0" y="160" font-size="16">1个机构 / 1 institution</text><text x="520.0" y="183" font-size="16" font-weight="600">19票 / 19 votes</text><text x="520.0" y="205" font-size="14">内部投票：13 / 19</text><text x="520.0" y="225" font-size="14">Internal voting: 13 / 19</text><rect class="card" x="30" y="90" width="310" height="148" rx="14" style="fill:#fff" /><text x="185.0" y="116" font-size="20" font-weight="600">省储委会</text><text x="185.0" y="138" font-size="16" font-weight="600">Provincial Reserve Committees</text><text x="185.0" y="160" font-size="16">43个机构 / 43 institutions</text><text x="185.0" y="183" font-size="16" font-weight="600">每机构1票 / 1 vote each</text><text x="185.0" y="205" font-size="14">每机构内部投票：6 / 9</text><text x="185.0" y="225" font-size="14">Internal voting per institution: 6 / 9</text><rect class="card" x="700" y="90" width="310" height="148" rx="14" style="fill:#fff" /><text x="855.0" y="116" font-size="20" font-weight="600">省储行</text><text x="855.0" y="138" font-size="16" font-weight="600">Provincial Reserve Banks</text><text x="855.0" y="160" font-size="16">43个机构 / 43 institutions</text><text x="855.0" y="183" font-size="16" font-weight="600">每机构1票 / 1 vote each</text><text x="855.0" y="205" font-size="14">每机构内部投票：6 / 9</text><text x="855.0" y="225" font-size="14">Internal voting per institution: 6 / 9</text><path class="line" d="M185 238V262H855V238 M520 238V285" /><rect class="card" x="225" y="285" width="590" height="70" rx="14" style="fill:#e7f3f1" /><text x="520" y="312" font-size="20" font-weight="600">87个治理机构，共105票</text><text x="520" y="337" font-size="18" font-weight="600">87 governance institutions, 105 votes</text><path class="line" d="M520 355V370H185V385 M520 370H687.5V385" /><rect class="card" x="30" y="385" width="310" height="96" rx="14" style="fill:#e7f3f1" /><text x="185" y="409" font-size="18" font-weight="600">105票全票赞成</text><text x="185" y="429" font-size="14">All 105 votes approve</text><text x="185" y="453" font-size="20" font-weight="600">联合投票通过</text><text x="185" y="473" font-size="14">Joint vote passes</text><rect class="card" x="365" y="385" width="645" height="96" rx="14" style="fill:#fff" /><text x="687.5" y="409" font-size="18" font-weight="600">任一机构否决或30天期满未全票通过</text><text x="687.5" y="429" font-size="14">Any institution rejects, or no unanimity within 30 days</text><text x="687.5" y="453" font-size="20" font-weight="600">进入联合公投</text><text x="687.5" y="473" font-size="14">Proceed to joint referendum</text><path class="line" d="M687.5 481V500H520V520" /><rect class="card" x="30" y="520" width="980" height="280" rx="14" style="fill:#fff" /><text x="520" y="548" font-size="20" font-weight="600">联合公投</text><text x="520" y="571" font-size="18" font-weight="600">Joint Referendum</text><text x="520" y="594" font-size="16">投票主体：提案人口快照中的全体有资格选民</text><text x="520" y="615" font-size="14">Electorate: all eligible voters in the proposal population snapshot</text><rect class="card" x="50" y="634" width="290" height="108" rx="14" style="fill:#e7f3f1" /><text x="195" y="663" font-size="18" font-weight="600">赞成票严格超过50%</text><text x="195" y="685" font-size="14">Approval strictly above 50%</text><text x="195" y="720" font-size="18" font-weight="600">通过 / Passed</text><rect class="card" x="375" y="634" width="290" height="108" rx="14" style="fill:#fff" /><text x="520" y="663" font-size="18" font-weight="600">反对票达到50%</text><text x="520" y="685" font-size="14">Opposition reaches 50%</text><text x="520" y="720" font-size="18" font-weight="600">否决 / Rejected</text><rect class="card" x="700" y="634" width="290" height="108" rx="14" style="fill:#fff" /><text x="845" y="663" font-size="18" font-weight="600">30天期满仍未通过</text><text x="845" y="685" font-size="14">No approval within 30 days</text><text x="845" y="720" font-size="18" font-weight="600">否决 / Rejected</text><text x="520" y="766" font-size="14">比例以全体合资格选民为分母；公投阶段自进入时重新计30天。</text><text x="520" y="787" font-size="13">Percentages use all eligible voters; the 30-day period restarts upon entering this stage.</text></svg>
