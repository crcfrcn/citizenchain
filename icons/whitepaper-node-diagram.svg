<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="744" viewBox="0 0 1040 744" role="img" aria-labelledby="title description">
<title id="title">公民链节点 / CitizenChain Nodes</title><desc id="description">治理机构和清算行以归档全节点运行，普通全节点与轻节点共同接入公民链。</desc>
