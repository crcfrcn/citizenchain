<text class="title"><tspan x="520" y="42">公民链节点</tspan><tspan x="520" y="74">CitizenChain Nodes</tspan></text><rect class="card" x="355" y="123" width="330" height="82" rx="14" style="fill:#e7f3f1"/><text class="label"><tspan x="520.0" y="157">公民链</tspan><tspan x="520.0" y="183">CitizenChain</tspan></text><path class="line" d="M520 205V236M190 236H850M190 236V265M520 236V265M850 236V265M520 236H20V450H775M265 450V480M775 450V480"/><rect class="card" x="40" y="265" width="300" height="150" rx="14" style="fill:#fff"/><text class="label"><tspan x="190.0" y="299">国家储委会权威节点</tspan><tspan x="190.0" y="325">National Reserve Committee</tspan><tspan x="190.0" y="351">Authority Node</tspan><tspan x="190.0" y="377">1</tspan></text><rect class="card" x="370" y="265" width="300" height="150" rx="14" style="fill:#fff"/><text class="label"><tspan x="520.0" y="299">省储委会权威节点</tspan><tspan x="520.0" y="325">Provincial Reserve Committee</tspan><tspan x="520.0" y="351">Authority Nodes</tspan><tspan x="520.0" y="377">43</tspan></text><rect class="card" x="700" y="265" width="300" height="150" rx="14" style="fill:#fff"/><text class="label"><tspan x="850.0" y="299">省储行权益节点</tspan><tspan x="850.0" y="325">Provincial Reserve Bank</tspan><tspan x="850.0" y="351">Stake Nodes</tspan><tspan x="850.0" y="377">43</tspan></text><rect class="card" x="40" y="480" width="450" height="135" rx="14" style="fill:#fff"/><text class="label"><tspan x="265.0" y="514">全节点：数量不限</tspan><tspan x="265.0" y="540">Full Nodes: Unlimited</tspan><tspan x="265.0" y="566">归档全节点 / 普通全节点</tspan><tspan x="265.0" y="592">Archive / Regular Full Nodes</tspan></text><rect class="card" x="550" y="480" width="450" height="135" rx="14" style="fill:#fff"/><text class="label"><tspan x="775.0" y="514">轻节点：数量不限</tspan><tspan x="775.0" y="540">Light Nodes: Unlimited</tspan><tspan x="775.0" y="566">公民 / 访客</tspan><tspan x="775.0" y="592">Citizens / Visitors</tspan></text><text class="body"><tspan x="520" y="663">国家储委会、省储委会、省储行和清算行均以归档全