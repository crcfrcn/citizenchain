name: "公民链·macOS"
run-name: "公民链·macOS·v${{ inputs.version }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: 产品确定的本次版本
        required: true
        type: string
      version_plan:
        description: 产品确定的版本与源码计划
        required: true
        type: string
concurrency:
  group: "${{ github.repository }}-macos"
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    name: "公民链·macOS·v${{ inputs.version }}"
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      CITIZENCHAIN_RELEASE_VERSION: "${{ inputs.version }}"
      CITIZENCHAIN_VERSION_PLAN: "${{ inputs.version_plan }}"
      GH_TOKEN: "${{ github.token }}"
      CARGO_INCREMENTAL: '1'
      APPLE_CERTIFICATE_BASE64: "${{ secrets.APPLE_CERTIFICATE_BASE64 }}"
      APPLE_CERTIFICATE_PASSWORD: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
      APPLE_PROFILE_BASE64: "${{ secrets.APPLE_PROFILE_BASE64 }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 核对本产品派发版本和源码计划
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs ci-version macos
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
          components: rust-src, clippy
      - name: 准备 macOS 原生依赖、官方 protoc 与签名身份
        shell: bash
        run: |
          set -euo pipefail
          # 系统签名复用既有Apple身份；逐项报告缺件，不输出材料或派生值。
          for required in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROFILE_BASE64; do
            test -n "${!required:-}" || { echo "缺少GitHub签名配置：$required" >&2; exit 1; }
          done
          # 完整收取版本输出，避免grep提前关闭管道令xcodebuild写入Broken pipe。
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version" | grep '^Xcode 27'
          brew install bash postgresql@17
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-osx-aarch_64.zip
          echo '45444963204757fd3e2fbe304bc1fdadfb488d8556ff099c4cc06575eab88976  '"$RUNNER_TEMP/protoc.zip" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/protoc" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          keychain="$RUNNER_TEMP/citizenchain-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/citizenchain.p12"
          printf '%s' "$APPLE_PROFILE_BASE64" | base64 -D > "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/citizenchain-ci.provisionprofile"
          security create-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security unlock-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security import "$RUNNER_TEMP/citizenchain.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$GITHUB_RUN_ID" "$keychain"
          security list-keychains -d user -s "$keychain"
          developer="$(cd "$(xcode-select -p)" && pwd -P)"
          {
            echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc"
            echo "PYTHON=$(command -v python3)"
            echo "PRODUCT_BASH_BIN=$(brew --prefix bash)/bin/bash"
            echo "LIBCLANG_PATH=$developer/Toolchains/XcodeDefault.xctoolchain/usr/lib"
            echo "DEVELOPER_DIR=$developer"
            echo "CC=$developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          } >> "$GITHUB_ENV"
      - name: 恢复macOS独立增量缓存
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/cache/macos
          key: citizenchain-cargo-v1-macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platform/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citizenchain-cargo-v1-macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platform/frontend/package-lock.json') }}-
      - name: 编译并验收 macOS App
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs ci-build macos > "$RUNNER_TEMP/citizenchain-build-result.json"
      - name: 验真macOS增量缓存
        continue-on-error: true
        if: success() || failure()
        id: cache_ready
        shell: bash
        run: |
          set -euo pipefail
          ready="$(node scripts/build.mjs ci-cache-ready macos)"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: 保存macOS独立增量缓存
        continue-on-error: true
        if: (success() || failure()) && steps.cache_ready.outputs.ready == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/cache/macos
          key: citizenchain-cargo-v1-macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platform/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 创建并回读 macOS GitHub Release
        shell: bash
        run: node scripts/build.mjs ci-release macos
      - name: 清理本平台编译现场
        if: always()
        shell: bash
        run: |
          if [ -d target/build/macos ]; then node scripts/build.mjs finish macos; fi
