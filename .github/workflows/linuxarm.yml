name: "公民链·LinuxARM"
run-name: "公民链·LinuxARM·v${{ inputs.version }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: 产品确定的本次版本
        required: true
        type: string
      version_plan:
        description: 产品确定的版本与源码计划
        required: true
        type: string
concurrency:
  group: "${{ github.repository }}-linux-arm"
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    name: "公民链·LinuxARM·v${{ inputs.version }}"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      CITIZENCHAIN_RELEASE_VERSION: "${{ inputs.version }}"
      CITIZENCHAIN_VERSION_PLAN: "${{ inputs.version_plan }}"
      GH_TOKEN: "${{ github.token }}"
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 核对本产品派发版本和源码计划
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs ci-version linux-arm
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-gnu
          components: rust-src, clippy
      - name: 准备 Linux 节点依赖和官方 protoc
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm-dev libclang-dev libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libpam0g-dev libxdo-dev pkg-config curl wget file unzip
          printf 'int main(void){return 0;}\n' | cc -x c - -lpam -lxdo -o "$RUNNER_TEMP/citizenchain-link-preflight"
          pkg-config --exists webkit2gtk-4.1 gtk+-3.0 openssl
          sudo apt-get install -y patchelf postgresql-16 postgresql-server-dev-16
          mkdir -p "$RUNNER_TEMP/pg-dist/bin" "$RUNNER_TEMP/pg-dist/lib" "$RUNNER_TEMP/pg-dist/share"
          cp -a "$(pg_config --bindir)/." "$RUNNER_TEMP/pg-dist/bin/"
          cp -a "$(pg_config --pkglibdir)/." "$RUNNER_TEMP/pg-dist/lib/"
          cp -a "$(pg_config --sharedir)/." "$RUNNER_TEMP/pg-dist/share/"
          echo "CITIZENCHAIN_PG_DIST=$RUNNER_TEMP/pg-dist" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-linux-aarch_64.zip"
          echo '36b518ac14d90351cc6598228ed2bbe5afe4e357b1af470b07e0ec1609875de2  '"$RUNNER_TEMP/protoc.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
      - name: 恢复Linux ARM独立增量缓存
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/cache/linux-arm
          key: citizenchain-cargo-v1-linux-arm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platform/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citizenchain-cargo-v1-linux-arm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platform/frontend/package-lock.json') }}-
      - name: 编译并验收本平台安装包
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs ci-build linux-arm > "$RUNNER_TEMP/citizenchain-build-result.json"
      - name: 验真Linux ARM增量缓存
        continue-on-error: true
        if: success() || failure()
        id: cache_ready
        shell: bash
        run: |
          set -euo pipefail
          ready="$(node scripts/build.mjs ci-cache-ready linux-arm)"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: 保存Linux ARM独立增量缓存
        continue-on-error: true
        if: (success() || failure()) && steps.cache_ready.outputs.ready == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/cache/linux-arm
          key: citizenchain-cargo-v1-linux-arm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platform/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 创建并回读本平台 GitHub Release
        shell: bash
        run: node scripts/build.mjs ci-release linux-arm
      - name: 清理本平台编译现场
        if: always()
        shell: bash
        run: |
          if [ -d "target/build/linux-arm" ]; then node scripts/build.mjs finish linux-arm; fi
