# 本平台GitHub任务归本工作流；编译调用产品编译入口。
---
name: 公民链·Windows
run-name: 公民链·Windows·${{ github.run_number }}
'on':
  workflow_dispatch: {}
concurrency:
  group: "${{ github.repository }}-windows-${{ github.event_name }}"
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    name: 公民链·Windows·版本
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '25.2.1'
        check-latest: false
    - id: version
      name: 计算本Run版本
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
        node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
        import {readFileSync} from 'node:fs';
        import {execFileSync} from 'node:child_process';
        // 每个平台只从自己的成功正式Release确定下一版；失败和重试不消耗版本。
        const platform='windows',workflow='windows.yml',prefix='公民链·Windows·v';
        const valid=value=>/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.test(value)
          &&value.split('.').every(part=>BigInt(part)<2n**64n);
        let version=JSON.parse(readFileSync('node/tauri.conf.json','utf8')).version;
        const releases=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/releases.json','utf8')).flat()
          .filter(row=>row.draft===false&&row.prerelease===false&&typeof row.tag_name==='string'&&row.tag_name.startsWith(prefix))
          .sort((a,b)=>String(b.published_at).localeCompare(String(a.published_at))||b.id-a.id);
        for(const release of releases){
          const records=String(release.body||'').split('\n').filter(line=>line.startsWith('<!-- automation:')&&line.endsWith(' -->'));
          if(records.length!==1)continue;
          const proof=JSON.parse(records[0].slice('<!-- automation:'.length,-' -->'.length));
          if(proof.repository!==process.env.GITHUB_REPOSITORY||proof.product_id!=='citizenchain'||proof.platform!==platform)continue;
          if(proof.schema!==1||proof.workflow!=='.github/workflows/'+workflow||!valid(proof.version)
            ||proof.tag!==release.tag_name||release.tag_name!==prefix+proof.version
            ||!Number.isSafeInteger(proof.run_id)||proof.run_id<=0)throw Error('本平台正式版本记录无效');
          const run=JSON.parse(execFileSync('gh',['api','repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+proof.run_id],{encoding:'utf8'}));
          if(run.status!=='completed'||run.conclusion!=='success')continue;
          if(run.path!==proof.workflow||run.head_branch!=='main'||run.event!=='workflow_dispatch'
            ||run.head_sha!==proof.source_sha||run.run_attempt!==proof.run_attempt)throw Error('正式版本与成功Run不符');
          const parts=proof.version.split('.');parts[2]=String(BigInt(parts[2])+1n);version=parts.join('.');
          break;
        }
        if(!valid(version))throw Error('本轮节点版本无效');
        console.log('version='+version);
        NODE
  build:
    name: 公民链·Windows·v${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      PLATFORM: windows
      CITIZENCHAIN_RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      TAURI_CONFIG: '{"version":"${{ needs.prepare.outputs.version }}"}'
      CITIZENCHAIN_SOURCE_SHA: "${{ github.sha }}"
      CARGO_TARGET_DIR: "${{ github.workspace }}/target/build/windows/cargo-target"
      CITIZENCHAIN_SOURCE_ROOT: "${{ github.workspace }}"
      CITIZENCHAIN_WORK_DIR: "${{ github.workspace }}/target/build/windows"
      CARGO_INCREMENTAL: '1'
      npm_config_cache: "${{ github.workspace }}/target/cache/windows/npm"
    outputs:
      assets: "${{ steps.assets.outputs.assets }}"
    steps:
    - name: 保留仓库原始换行，避免检出改写生成物
      shell: pwsh
      run: git config --global core.autocrlf false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      with:
        toolchain: 1.97.1
        targets: x86_64-pc-windows-msvc, wasm32v1-none
        components: rust-src
    - name: 准备 Windows 节点依赖和官方 protoc
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
        Invoke-WebRequest 'https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-win64.zip' -OutFile $zip
        $dir = Join-Path $env:RUNNER_TEMP 'protoc'
        Expand-Archive $zip -DestinationPath $dir
        if (-not (Test-Path (Join-Path $env:PGROOT 'bin\initdb.exe'))) { throw 'Runner 缺少 PostgreSQL 17 原件' }
        # 复用Runner现有x64 MSVC OpenSSL开发库；只声明位置，不另下载或安装。
        $openssl = Join-Path $env:ProgramFiles 'OpenSSL'
        $opensslInclude = Join-Path $openssl 'include'
        $opensslLib = Join-Path $openssl 'lib\VC\x64\MD'
        $opensslBin = Join-Path $openssl 'bin'
        foreach ($file in @((Join-Path $opensslInclude 'openssl\ssl.h'), (Join-Path $opensslLib 'libssl.lib'), (Join-Path $opensslLib 'libcrypto.lib'), (Join-Path $opensslBin 'libssl-3-x64.dll'), (Join-Path $opensslBin 'libcrypto-3-x64.dll'))) {
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Runner预装OpenSSL开发原件缺失：$file" }
        }
        "OPENSSL_DIR=$openssl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "OPENSSL_INCLUDE_DIR=$opensslInclude" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "OPENSSL_LIB_DIR=$opensslLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "OPENSSL_STATIC=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "PROTOC=$(Join-Path $dir 'bin\protoc.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        # 使用Runner现有Visual Studio官方可再分发CRT，应用本地部署，不要求客户另装VC运行库。
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Runner缺少官方MSVC位置' }
        $version = (Get-Content (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt') -Raw).Trim()
        $crt = @(Get-ChildItem -Directory (Join-Path $vs "VC\Redist\MSVC\$version\x64") -Filter 'Microsoft.VC*.CRT')
        if ($crt.Count -ne 1 -or -not (Test-Path (Join-Path $crt[0].FullName 'vcruntime140.dll'))) { throw '官方x64 CRT原件不唯一或缺件' }
        "CITIZENCHAIN_VC_CRT_DIR=$($crt[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CITIZENCHAIN_PG_DIST=$env:PGROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "LIBCLANG_PATH=$env:PROGRAMFILES\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: 恢复本平台官方增量缓存
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          target/build/windows/cargo-target/release/.fingerprint
          target/build/windows/cargo-target/release/build
          target/build/windows/cargo-target/release/deps
          target/build/windows/cargo-target/release/incremental
          target/cache/windows/npm
        key: citizenchain-windows-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/protocol/Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platformweb/package-lock.json', 'onchina/registryweb/package-lock.json', 'onchina/legislationweb/package-lock.json', 'onchina/private/frontend/package-lock.json', 'onchina/judicial/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: 'citizenchain-windows-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'', ''crates/protocol/Cargo.lock'', ''config.toml'', ''crates/scanner/package-lock.json'', ''node/frontend/package-lock.json'', ''onchina/platformweb/package-lock.json'', ''onchina/registryweb/package-lock.json'', ''onchina/legislationweb/package-lock.json'', ''onchina/private/frontend/package-lock.json'', ''onchina/judicial/frontend/package-lock.json'') }}-

          '
    - name: 执行产品所属真实测试
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$CITIZENCHAIN_WORK_DIR"
        npm ci --prefix crates/scanner --include=dev
        npm ci --prefix node/frontend --include=dev
        npm ci --prefix onchina/platformweb --include=dev
        npm ci --prefix onchina/registryweb --include=dev
        npm ci --prefix onchina/legislationweb --include=dev
        npm ci --prefix onchina/private/frontend --include=dev
        npm ci --prefix onchina/judicial/frontend --include=dev
        node --test --test-concurrency=1 onchina/platform/tests/structure.test.mjs node/frontend/tests/metamask.test.mjs
        cargo test --manifest-path crates/protocol/Cargo.toml --locked
        npm run check --prefix crates/scanner
        npm test --prefix crates/scanner
        npm run test:local-doc --prefix node/frontend
        npm run test:types --prefix node/frontend
        npm test --prefix node/frontend
        npm run typecheck --prefix onchina/platformweb
        npm run typecheck --prefix onchina/registryweb
        npm run typecheck --prefix onchina/legislationweb
        npm run typecheck --prefix onchina/private/frontend
        npm run typecheck --prefix onchina/judicial/frontend
        npm test --prefix onchina/platformweb
        npm test --prefix onchina/registryweb
        npm test --prefix onchina/legislationweb
        npm test --prefix onchina/private/frontend
        npm test --prefix onchina/judicial/frontend
        export TAURI_CONFIG="$(node -e 'console.log(JSON.stringify({build:{beforeBuildCommand:null,frontendDist:process.env.GITHUB_WORKSPACE+"/node/frontend"}}))')"
        export NODE="$(node -p process.execPath)" CITIZENCHAIN_BUILD_PLATFORM="$PLATFORM"
        unset SKIP_WASM_BUILD WASM_FILE DOCS_RS
        for key in $(compgen -v); do
          case "$key" in APPLE_*|*_TOKEN|*_PASSWORD|*_PRIVATE_KEY|*_SECRET|NODE_OPTIONS|NODE_PATH|NODE_TEST_CONTEXT|SKIP_*_WASM_BUILD) unset "$key" ;; esac
        done
        export PATH="$(cygpath -u "$OPENSSL_DIR")/bin:$PATH"
        cargo --config config.toml clean -p runtime --locked
        cargo --config config.toml test --locked --release --workspace --all-targets
    - name: 编译及核对完整产物
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$CITIZENCHAIN_SOURCE_SHA"
        git diff --quiet HEAD
        node scripts/build.mjs windows
    - name: 验收链上中国实际模块产物
      shell: bash
      run: |
        set -euo pipefail
        export ONCHINA_TEST_MODULE_ROOT="$(node -e 'console.log(require("node:fs").realpathSync(require("node:path").join(process.env.CITIZENCHAIN_WORK_DIR,"onchina-modules")))')"
        export ONCHINA_TEST_MODULE_IDS="$(node -e 'console.log(JSON.stringify(require("node:fs").readdirSync(process.env.ONCHINA_TEST_MODULE_ROOT,{withFileTypes:true}).filter(entry=>entry.isDirectory()).map(entry=>entry.name)))')"
        node --test --test-name-pattern '实际模块产物' onchina/platform/tests/structure.test.mjs
        npm test --prefix onchina/platformweb -- -t '实际IIFE装载'
    - name: 记录实际产物原始字节
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: assets
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const {product}=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const {createReadStream,lstatSync,readdirSync}=await import('node:fs');
          const {createHash}=await import('node:crypto');
          const p=process.env.PLATFORM,version=process.env.CITIZENCHAIN_RELEASE_VERSION,declared=product.platforms[p];
          const names=declared.files||[declared.artifact.replace('{version}',version)];
          const tag=product.title+'·'+declared.name+'·v'+version,directory=process.env.GITHUB_WORKSPACE+'/target/build/'+p+'/artifact';
          if(JSON.stringify(readdirSync(directory).sort())!==JSON.stringify([...names].sort()))throw Error('完整产物集合不符');
          const assets=[];
          for(const name of names){
            const path=directory+'/'+name,info=lstatSync(path);
            if(!info.isFile()||info.isSymbolicLink()||info.size<=0)throw Error('产物不是非空普通文件');
            const hash=createHash('sha256');for await(const bytes of createReadStream(path))hash.update(bytes);
            assets.push({name,label:tag+(p==='wasm'?name.slice('runtime'.length):declared.extension),size:info.size,sha256:hash.digest('hex')});
          }
          core.setOutput('assets',JSON.stringify(assets));
    - name: 保存本平台官方增量缓存
      if: success() || failure()
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          target/build/windows/cargo-target/release/.fingerprint
          target/build/windows/cargo-target/release/build
          target/build/windows/cargo-target/release/deps
          target/build/windows/cargo-target/release/incremental
          target/cache/windows/npm
        key: citizenchain-windows-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/protocol/Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platformweb/package-lock.json', 'onchina/registryweb/package-lock.json', 'onchina/legislationweb/package-lock.json', 'onchina/private/frontend/package-lock.json', 'onchina/judicial/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: 上传完整Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: 公民链·Windows·v${{ needs.prepare.outputs.version }}
        path: target/build/windows/artifact
        if-no-files-found: error
    - name: 清理本轮编译现场
      if: always()
      shell: bash
      run: node --input-type=module -e "import {rmSync,existsSync} from 'node:fs'; import {resolve} from 'node:path'; const work=resolve('target/build/windows'); if(work!==resolve(process.env.CITIZENCHAIN_WORK_DIR))throw Error('现场不符'); if(existsSync(resolve(work,'.retain-runtime-work')))throw Error('Runtime工具退出未确认，保留现场'); rmSync(work,{recursive:true,force:true});"
  release:
    name: 公民链·Windows·v${{ needs.prepare.outputs.version }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      PLATFORM: windows
      CITIZENCHAIN_RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      CITIZENCHAIN_SOURCE_SHA: "${{ github.sha }}"
      GH_TOKEN: "${{ github.token }}"
      SOURCE_ASSETS: "${{ needs.build.outputs.assets }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: 公民链·Windows·v${{ needs.prepare.outputs.version }}
        path: "${{ runner.temp }}/artifact"
    - name: 创建并回读正式Tag与Release
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const {product}=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const {readFileSync,writeFileSync,createReadStream}=await import('node:fs');
          const {createHash}=await import('node:crypto');
          const {execFileSync}=await import('node:child_process');
          const p=process.env.PLATFORM,version=process.env.CITIZENCHAIN_RELEASE_VERSION,declared=product.platforms[p];
          const tag=product.title+'·'+declared.name+'·v'+version,assets=JSON.parse(process.env.SOURCE_ASSETS);
          const names=declared.files||[declared.artifact.replace('{version}',version)],source=process.env.RUNNER_TEMP+'/artifact';
          if(context.sha!==process.env.CITIZENCHAIN_SOURCE_SHA||context.ref!=='refs/heads/main')throw Error('发布源码身份不符');
          if(JSON.stringify(assets.map(asset=>asset.name).sort())!==JSON.stringify([...names].sort()))throw Error('正式产物集合不完整');
          for(const asset of assets){
            const bytes=readFileSync(source+'/'+asset.name),hash=createHash('sha256');
            for await(const chunk of createReadStream(source+'/'+asset.name))hash.update(chunk);
            if(bytes.length!==asset.size||hash.digest('hex')!==asset.sha256)throw Error('正式产物字节不符');
          }
          const proof={schema:1,repository:product.repository,product_id:product.id,platform:p,workflow:'.github/workflows/'+declared.workflow,
            run_id:context.runId,run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),source_sha:context.sha,version,tag,assets};
          if(p==='wasm'){
            const runtime=JSON.parse(process.env.RUNTIME_BUILD);
            if(String(runtime.spec_version)!==version||process.env.BUILT_VERSION!==version||runtime.source_sha!==context.sha)throw Error('WASM实际版本不符');
            proof.runtime=runtime;
          }
          const notes=process.env.RUNNER_TEMP+'/release-notes.txt';writeFileSync(notes,'<!-- automation:'+JSON.stringify(proof)+' -->\n');
          execFileSync('gh',['release','create',tag,...assets.map(asset=>source+'/'+asset.name+'#'+asset.label),
            '--repo',product.repository,'--target',context.sha,'--title',tag,'--notes-file',notes,'--draft','--latest=false'],{stdio:['ignore','pipe','pipe']});
          const drafts=(await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100})).filter(value=>value.tag_name===tag);
          if(drafts.length!==1)throw Error('本轮草稿不唯一');
          const published=drafts[0];
          if(!published.draft||published.prerelease||published.assets.length!==assets.length)throw Error('本轮草稿或附件状态不符');
          for(const asset of published.assets){
            const original=assets.find(value=>value.name===asset.name);
            if(!original||asset.state!=='uploaded'||asset.size!==original.size||asset.digest!=='sha256:'+original.sha256||asset.label!==original.label)throw Error('正式附件回读不符');
          }
          const result=(await github.rest.repos.updateRelease({...context.repo,release_id:published.id,draft:false})).data;
          if(result.draft||result.prerelease||!result.published_at)throw Error('正式Release发布未确认');
          const ref=(await github.rest.git.getRef({...context.repo,ref:'tags/'+tag})).data;
          if(ref.object.type!=='commit'||ref.object.sha!==context.sha)throw Error('正式Tag提交不符');
          core.info('正式交付已确认：'+tag);
  cleanup:
    name: 公民链·Windows·v${{ needs.prepare.outputs.version }}
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [prepare, build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      PLATFORM: windows
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - name: 清理本平台已完成历史
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const {product}=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const p=process.env.PLATFORM,repo=context.repo,workflow=product.platforms[p].workflow;
          const prefix=product.title+'·'+product.platforms[p].name+'·v';
          const rows=()=>github.paginate(github.rest.actions.listWorkflowRuns,{...repo,workflow_id:workflow,branch:'main',per_page:100});
          const terminal=(await rows()).filter(run=>run.id!==context.runId&&run.status==='completed'&&run.path==='.github/workflows/'+workflow);
          const builds=terminal.filter(run=>run.event==='workflow_dispatch').sort((a,b)=>b.run_number-a.run_number||b.id-a.id);
          const keep=new Set([builds.find(run=>run.conclusion==='success')?.id,builds.find(run=>run.conclusion!=='success')?.id]);
          const obsolete=terminal.filter(run=>run.event==='workflow_dispatch'&&!keep.has(run.id)
            ||run.event==='repository_dispatch'&&run.display_title.startsWith(prefix));
          const releases=await github.paginate(github.rest.repos.listReleases,{...repo,per_page:100});
          for(const old of obsolete){
            const current=(await github.rest.actions.getWorkflowRun({...repo,run_id:old.id})).data;
            if(current.status!=='completed'||current.head_sha!==old.head_sha||current.run_attempt!==old.run_attempt||current.conclusion!==old.conclusion)throw Error('旧Run终态变化，停止删除');
            for(const release of releases.filter(value=>value.tag_name.startsWith(prefix))){
              const lines=String(release.body||'').split(/\r?\n/u).filter(line=>line.startsWith('<!-- automation:')&&line.endsWith(' -->'));
              if(lines.length!==1)continue;
              const proof=JSON.parse(lines[0].slice(16,-4));
              if(proof.run_id!==old.id)continue;
              if(proof.source_sha!==old.head_sha||release.target_commitish!==old.head_sha||proof.tag!==release.tag_name)throw Error('旧Release归属不符');
              try{
                const tag=(await github.rest.git.getRef({...repo,ref:'tags/'+release.tag_name})).data;
                if(tag.object.type!=='commit'||tag.object.sha!==old.head_sha)throw Error('旧Tag提交变化');
                await github.rest.git.deleteRef({...repo,ref:'tags/'+release.tag_name});
              }catch(error){if(error.status!==404)throw error;}
              await github.rest.repos.deleteRelease({...repo,release_id:release.id});
            }
            await github.rest.actions.deleteWorkflowRun({...repo,run_id:old.id});
            try{await github.rest.actions.getWorkflowRun({...repo,run_id:old.id});throw Error('旧Run删除未确认');}catch(error){if(error.status!==404)throw error;}
          }
          const remaining=await rows();
          if(obsolete.some(old=>remaining.some(run=>run.id===old.id)))throw Error('历史删除回读未通过');
          await core.summary.addHeading('已完成历史清理').addRaw('仅按真实已完成结果保留最近成功、最近非成功；活动Run保持。当前Run尚未终态，严格最终两条尚未确认。').write();
