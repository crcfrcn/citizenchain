# 四端准备、测试、编译、正式交付及历史清理均在同一Run内完成。
---
name: 公民链·LinuxAMD
run-name: 公民链·LinuxAMD·${{ github.run_number }}
'on':
  workflow_dispatch: {}
concurrency:
  group: "${{ github.repository }}-linux-amd-${{ github.event_name }}"
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    name: 公民链·LinuxAMD·版本
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '25.2.1'
        check-latest: false
    - id: version
      name: 计算本Run版本
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api "repos/$GITHUB_REPOSITORY/actions/workflows/linuxamd.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=1" > "$RUNNER_TEMP/previous.json"
        node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
        import {readFileSync} from 'node:fs';
        import {execFileSync} from 'node:child_process';
        let version=JSON.parse(readFileSync('node/tauri.conf.json','utf8')).version;
        const previous=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/previous.json','utf8')).workflow_runs[0];
        if(previous){
          const data=JSON.parse(execFileSync('gh',['api','repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+previous.id+'/artifacts?per_page=100'],{encoding:'utf8'}));
          const prefix="公民链·LinuxAMD·v";
          const artifact=data.artifacts.find(value=>value.name.startsWith(prefix)&&/^\d+\.\d+\.\d+$/u.test(value.name.slice(prefix.length)));
          const parts=artifact.name.slice(prefix.length).split('.');parts[2]=String(BigInt(parts[2])+1n);version=parts.join('.');
        }
        console.log('version='+version);
        NODE
  build:
    name: 公民链·LinuxAMD·v${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PLATFORM: linux-amd
      CITIZENCHAIN_RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      CITIZENCHAIN_SOURCE_SHA: "${{ github.sha }}"
      CARGO_TARGET_DIR: "${{ github.workspace }}/target/build/linux-amd/cargo-target"
      CITIZENCHAIN_SOURCE_ROOT: "${{ github.workspace }}"
      CITIZENCHAIN_WORK_DIR: "${{ github.workspace }}/target/build/linux-amd"
      CARGO_INCREMENTAL: '1'
      npm_config_cache: "${{ github.workspace }}/target/cache/linux-amd/npm"
    outputs:
      assets: "${{ steps.assets.outputs.assets }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      with:
        toolchain: 1.97.1
        targets: x86_64-unknown-linux-gnu, wasm32v1-none
        components: rust-src
    - name: 准备 Linux 节点依赖和官方 protoc
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential clang llvm-dev libclang-dev libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libpam0g-dev libxdo-dev pkg-config patchelf file unzip bison flex
        printf 'int main(void){return 0;}\n' | cc -x c - -lpam -lxdo -o "$RUNNER_TEMP/citizenchain-link-preflight"
        pkg-config --exists webkit2gtk-4.1 gtk+-3.0 openssl
        pg_version="$(node --input-type=module -e "import {product} from './scripts/config.mjs'; console.log(product.tools.postgres)")"
        curl --fail --location --proto =https --proto-redir =https --retry 3 --output "$RUNNER_TEMP/postgres.tar.bz2" "https://ftp.postgresql.org/pub/source/v$pg_version/postgresql-$pg_version.tar.bz2"
        tar -xjf "$RUNNER_TEMP/postgres.tar.bz2" -C "$RUNNER_TEMP"
        (
          cd "$RUNNER_TEMP/postgresql-$pg_version"
          ./configure --prefix="$RUNNER_TEMP/pg-dist" --without-readline --without-icu --without-zlib --with-openssl
          make -j4
          make install
          cp COPYRIGHT "$RUNNER_TEMP/pg-dist/COPYRIGHT"
        )
        # 系统cp跟随上游库别名生成物理副本，编译输入不带指向临时原件的链接。
        cp -RL "$RUNNER_TEMP/pg-dist" "$RUNNER_TEMP/pg-runtime"
        echo "CITIZENCHAIN_PG_DIST=$RUNNER_TEMP/pg-runtime" >> "$GITHUB_ENV"
        echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
        curl --fail --location --proto =https --proto-redir =https --retry 3 --output "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-linux-x86_64.zip"
        mkdir -p "$RUNNER_TEMP/protoc"
        unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
        echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
    - name: 恢复本平台官方增量缓存
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          target/build/linux-amd/cargo-target/release/.fingerprint
          target/build/linux-amd/cargo-target/release/build
          target/build/linux-amd/cargo-target/release/deps
          target/build/linux-amd/cargo-target/release/incremental
          target/cache/linux-amd/npm
        key: citizenchain-linux-amd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/protocol/Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platform/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: 'citizenchain-linux-amd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'', ''crates/protocol/Cargo.lock'', ''config.toml'', ''crates/scanner/package-lock.json'', ''node/frontend/package-lock.json'', ''onchina/platform/frontend/package-lock.json'') }}-

          '
    - name: 执行产品所属真实测试
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$CITIZENCHAIN_WORK_DIR"
        node --test scripts/config.mjs scripts/runtime.mjs
        npm ci --prefix crates/scanner --include=dev
        npm ci --prefix node/frontend --include=dev
        npm ci --prefix onchina/platform/frontend --include=dev
        node --test --test-concurrency=1 onchina/platform/modules/structure.test.mjs node/frontend/metamask.mjs
        cargo test --manifest-path crates/protocol/Cargo.toml --locked
        npm run check --prefix crates/scanner
        npm test --prefix crates/scanner
        npm run test:local-doc --prefix node/frontend
        npm run typecheck --prefix onchina/platform/frontend
        npm test --prefix onchina/platform/frontend
        export TAURI_CONFIG="$(node -e 'console.log(JSON.stringify({build:{beforeBuildCommand:null,frontendDist:process.env.GITHUB_WORKSPACE+"/node/frontend"}}))')"
        # 唯一Runtime入口提供测试依赖WASM，原测试和金标不跳过。
        node scripts/runtime.mjs test
    - name: 编译及核对完整产物
      id: compile
      shell: bash
      run: |
        set -euo pipefail
        node scripts/build.mjs linux-amd
    - name: 输出失败资源链接
      if: ${{ failure() && steps.compile.outcome == 'failure' }}
      shell: bash
      run: |
        # 独立诊断只读取路径及目标，原编译步骤的失败退出码保持。
        if [ -d "$CITIZENCHAIN_WORK_DIR/resources" ]; then
          find "$CITIZENCHAIN_WORK_DIR/resources" -type l -exec ls -ld {} +
        fi
    - name: 记录实际产物原始字节
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: assets
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const cfg=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const p=process.env.PLATFORM,repo=context.repo;
          const {createReadStream,lstatSync,readdirSync}=await import('node:fs');
          const {createHash}=await import('node:crypto');
          const directory=process.env.GITHUB_WORKSPACE+'/target/build/'+p+'/artifact';
          const names=cfg.artifactNames(p,process.env.CITIZENCHAIN_RELEASE_VERSION);
          if(JSON.stringify(readdirSync(directory).sort())!==JSON.stringify([...names].sort()))throw Error('完整产物集合不符');
          const assets=[];
          for(const name of names){const path=directory+'/'+name,info=lstatSync(path);if(!info.isFile()||info.isSymbolicLink()||info.size<=0)throw Error('产物不是非空普通文件');
           const hash=createHash('sha256');for await(const bytes of createReadStream(path))hash.update(bytes);
           assets.push({name,label:cfg.artifactLabel(p,process.env.CITIZENCHAIN_RELEASE_VERSION,name),size:info.size,sha256:hash.digest('hex')});}
          core.setOutput('assets',JSON.stringify(assets));
    - name: 保存本平台官方增量缓存
      if: success() || failure()
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          target/build/linux-amd/cargo-target/release/.fingerprint
          target/build/linux-amd/cargo-target/release/build
          target/build/linux-amd/cargo-target/release/deps
          target/build/linux-amd/cargo-target/release/incremental
          target/cache/linux-amd/npm
        key: citizenchain-linux-amd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/protocol/Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platform/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: 上传完整Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: 公民链·LinuxAMD·v${{ needs.prepare.outputs.version }}
        path: target/build/linux-amd/artifact
        if-no-files-found: error
    - name: 清理本轮编译现场
      if: always()
      shell: bash
      run: node --input-type=module -e "import {rmSync,existsSync} from 'node:fs'; import {resolve} from 'node:path'; const work=resolve('target/build/linux-amd'); if(work!==resolve(process.env.CITIZENCHAIN_WORK_DIR))throw Error('现场不符'); if(existsSync(resolve(work,'.retain-runtime-work')))throw Error('Runtime工具退出未确认，保留现场'); rmSync(work,{recursive:true,force:true});"
  release:
    name: 公民链·LinuxAMD·v${{ needs.prepare.outputs.version }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      PLATFORM: linux-amd
      CITIZENCHAIN_RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      CITIZENCHAIN_SOURCE_SHA: "${{ github.sha }}"
      GH_TOKEN: "${{ github.token }}"
      SOURCE_ASSETS: "${{ needs.build.outputs.assets }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: 公民链·LinuxAMD·v${{ needs.prepare.outputs.version }}
        path: "${{ runner.temp }}/artifact"
    - name: 创建并回读正式Tag与Release
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const cfg=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const p=process.env.PLATFORM,repo=context.repo;
          const {readFileSync,writeFileSync,mkdirSync,createReadStream}=await import('node:fs');
          const {createHash}=await import('node:crypto');
          const {execFileSync}=await import('node:child_process');
          const tag=cfg.releaseName(p,process.env.CITIZENCHAIN_RELEASE_VERSION),assets=JSON.parse(process.env.SOURCE_ASSETS);
          const names=cfg.artifactNames(p,process.env.CITIZENCHAIN_RELEASE_VERSION);
          if(JSON.stringify(assets.map(asset=>asset.name).sort())!==JSON.stringify([...names].sort()))throw Error('生产Run产物声明不完整');
          const hashFile=async path=>{const hash=createHash('sha256');for await(const bytes of createReadStream(path))hash.update(bytes);return hash.digest('hex');};
          const source=process.env.RUNNER_TEMP+'/artifact';
          for(const asset of assets){const bytes=readFileSync(source+'/'+asset.name);if(bytes.length!==asset.size||await hashFile(source+'/'+asset.name)!==asset.sha256)throw Error('Actions附件偏离生产Run原始字节');}
          const proof={schema:1,repository:cfg.product.repository,product_id:cfg.product.id,platform:p,workflow:'.github/workflows/'+cfg.product.platforms[p].workflow,
           run_id:context.runId,run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),source_sha:context.sha,version:process.env.CITIZENCHAIN_RELEASE_VERSION,tag,assets};
          const notes=process.env.RUNNER_TEMP+'/release-notes.txt';writeFileSync(notes,'<!-- automation:'+JSON.stringify(proof)+' -->\n');
          const gh=args=>execFileSync('gh',args,{stdio:['ignore','pipe','pipe'],encoding:'utf8',maxBuffer:4*1024*1024});
          gh(['release','create',tag,...assets.map(asset=>source+'/'+asset.name+'#'+asset.label),'--repo',cfg.product.repository,'--target',context.sha,'--title',tag,'--notes-file',notes,'--draft','--latest=false']);
          let draft=(await github.paginate(github.rest.repos.listReleases,{...repo,per_page:100})).filter(value=>value.tag_name===tag);
          if(draft.length!==1)throw Error('本轮草稿不唯一');
          const run=(await github.rest.actions.getWorkflowRun({...repo,run_id:context.runId})).data;
          cfg.assertRelease(p,draft[0],run,{draft:true});
          const downloaded=process.env.RUNNER_TEMP+'/release-download';mkdirSync(downloaded);
          gh(['release','download',tag,'--repo',cfg.product.repository,'--dir',downloaded]);
          for(const asset of assets)if(!readFileSync(downloaded+'/'+asset.name).equals(readFileSync(source+'/'+asset.name)))throw Error('正式附件回读字节不符');
          gh(['release','edit',tag,'--repo',cfg.product.repository,'--draft=false','--latest=false']);
          const published=(await github.rest.repos.getRelease({...repo,release_id:draft[0].id})).data;
          cfg.assertRelease(p,published,run);
          const ref=(await github.rest.git.getRef({...repo,ref:'tags/'+tag})).data;
          if(ref.object.type!=='commit'||ref.object.sha!==context.sha)throw Error('正式Tag提交不符');
          for(const asset of published.assets)if(new URL(asset.browser_download_url).href!=='https://github.com/'+cfg.product.repository+'/releases/download/'+encodeURIComponent(tag)+'/'+encodeURIComponent(asset.name))throw Error('正式附件下载地址不符');
          core.info('正式Tag、Release及完整附件已确认：'+tag);
  cleanup:
    name: 公民链·LinuxAMD·v${{ needs.prepare.outputs.version }}
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [prepare, build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      PLATFORM: linux-amd
      CITIZENCHAIN_RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      CITIZENCHAIN_SOURCE_SHA: "${{ github.sha }}"
      JOB_RESULTS: '{"prepare":"${{ needs.prepare.result }}","build":"${{ needs.build.result }}","release":"${{ needs.release.result }}"}'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - name: 清理本平台历史，不派发、不重编、不取消
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const cfg=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const p=process.env.PLATFORM,repo=context.repo,results=JSON.parse(process.env.JOB_RESULTS);
          const getRun=id=>github.rest.actions.getWorkflowRun({...repo,run_id:id}).then(value=>value.data).catch(error=>{if(error.status===404)return null;throw error;});
          const original=async()=>{const run=await getRun(context.runId);cfg.assertRun(p,run,context.runId);
           if(run.head_sha!==context.sha||run.head_sha!==process.env.CITIZENCHAIN_SOURCE_SHA||run.run_attempt!==Number(process.env.GITHUB_RUN_ATTEMPT)
            )throw Error('本轮源码、attempt或交付版本变化');return run;};
          const rows=()=>github.paginate(github.rest.actions.listWorkflowRuns,{...repo,workflow_id:cfg.product.platforms[p].workflow,branch:'main',per_page:100});
          const plan=async()=>cfg.nativeCleanupPlan(p,await original(),results,await rows());
          const getRelease=id=>github.rest.repos.getRelease({...repo,release_id:id}).then(value=>value.data).catch(error=>{if(error.status===404)return null;throw error;});
          const getTag=tag=>github.rest.git.getRef({...repo,ref:'tags/'+tag}).then(value=>value.data).catch(error=>{if(error.status===404)return null;throw error;});
          let assetError;
          try{
          const initial=await plan(),releases=await github.paginate(github.rest.repos.listReleases,{...repo,per_page:100});
          const prefix=cfg.product.title+'·'+cfg.product.platforms[p].name+'·v';
          const proven=releases.filter(value=>value.tag_name.startsWith(prefix)).map(release=>({release,proof:cfg.readReleaseProof(p,release)}));
          // 成功保留项可以是当前仍在运行的候选，但必须已有完整正式交付；不伪造最终conclusion。
          let latest;
          if(initial.success){const matches=proven.filter(value=>value.proof.run_id===initial.success.id);if(matches.length!==1)throw Error('成功保留项没有唯一完整正式交付');
           latest=matches[0];cfg.assertRelease(p,latest.release,initial.success);
           const ref=await getTag(latest.proof.tag);if(!ref||ref.object.type!=='commit'||ref.object.sha!==initial.success.head_sha)throw Error('成功保留项Tag提交不符');}
          for(const item of proven){
           if(item.release.id===latest?.release.id)continue;
           const fresh=await plan();if(fresh.success?.id!==initial.success?.id||fresh.failure?.id!==initial.failure?.id)throw Error('保留集合变化，停止删除');
           const run=await getRun(item.proof.run_id);
           if(!run){
            // 旧Run已删除时只核对真实交付；没有本轮完整替代就保留旧正式产物。
            const current=await getRelease(item.release.id);if(!current)continue;
            const proof=cfg.assertReleaseAssets(p,current),ref=await getTag(proof.tag);
            if(JSON.stringify(proof)!==JSON.stringify(item.proof))throw Error('旧正式交付来源变化');
            if(!ref||ref.object.type!=='commit'||ref.object.sha!==proof.source_sha)throw Error('旧正式Tag提交变化');
            if(initial.success?.id!==context.runId||results.release!=='success'){core.warning('旧Run已缺失，保留尚无本轮替代的正式交付：'+proof.tag);continue;}
            const replacement=await getRelease(latest.release.id);if(!replacement)throw Error('替代正式交付不存在');
            const newer=cfg.assertRelease(p,replacement,await original()),newRef=await getTag(newer.tag);
            if(!newRef||newRef.object.type!=='commit'||newRef.object.sha!==newer.source_sha)throw Error('替代正式Tag提交变化');
            if(cfg.compareDeliveryVersions(newer.version,proof.version)<=0)throw Error('替代正式版本没有递增');
            if(current.immutable)throw Error('旧Release不可变，未修改仓库设置');
            await github.rest.git.deleteRef({...repo,ref:'tags/'+proof.tag});if(await getTag(proof.tag))throw Error('Tag删除未确认');
            await github.rest.repos.deleteRelease({...repo,release_id:current.id});if(await getRelease(current.id))throw Error('Release删除未确认');
            continue;
           }
           cfg.assertRun(p,run,item.proof.run_id);
           // 本轮发布Job已失败时允许撤除其准确部分交付；其他活动Run的任何资产都保护。
           const ownFailedRelease=run.id===context.runId&&results.release==='failure';
           if(run.status!=='completed'&&!ownFailedRelease)continue;
           const current=await getRelease(item.release.id);if(!current)continue;
           const proof=cfg.assertRelease(p,current,run,{partial:ownFailedRelease||run.conclusion!=='success',draft:true});
           if(current.immutable)throw Error('旧Release不可变，未修改仓库设置');
           const ref=await getTag(proof.tag);
           if(ref){if(ref.object.type!=='commit'||ref.object.sha!==run.head_sha)throw Error('旧Tag提交变化');
            await github.rest.git.deleteRef({...repo,ref:'tags/'+proof.tag});if(await getTag(proof.tag))throw Error('Tag删除未确认');}
           await github.rest.repos.deleteRelease({...repo,release_id:current.id});if(await getRelease(current.id))throw Error('Release删除未确认');
          }
          }catch(error){assetError=error;}
          // 旧资产错误独立汇总，不能阻断多余终态Run的实际删除与回读。
          const retained=await cfg.cleanupNativeRuns(p,{list:rows,get:getRun,remove:id=>github.rest.actions.deleteWorkflowRun({...repo,run_id:id})},await original(),results,Boolean(assetError));
          if(assetError)throw assetError;
          await core.summary.addHeading('原Run内四端历史清理').addRaw('本轮编译交付候选：'+(results.prepare==='success'&&results.build==='success'&&results.release==='success'?'success':'failure')+'；清理操作及删除回读已确认。\n')
           .addRaw('本轮最终conclusion仍由GitHub在Job结束后确定；异常中断可能无法保持两条记录，不能恢复已删除Run。\n')
           .addRaw('其他活动任务保持；没有派发收尾、重编或取消请求。').write();
