# WASM的GitHub任务归本工作流；编译只调用产品Runtime入口。
---
name: 公民链·WASM
run-name: 公民链·WASM·v${{ inputs.version }}
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 读取链上spec_version后加1的目标整数版本
        required: true
        type: string
      transaction_version:
        description: 读取链上transaction_version后加1的目标整数版本
        required: true
        type: string
      runtime_base:
        description: 本机节点读取的Runtime基线JSON，仅属于本轮任务
        required: true
        type: string
      source_sha:
        description: 批准的main完整提交
        required: true
        type: string
concurrency:
  group: "${{ github.repository }}-wasm-${{ github.event_name }}"
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    name: 公民链·WASM·v${{ inputs.version }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      PLATFORM: wasm
      CITIZENCHAIN_RELEASE_VERSION: "${{ inputs.version }}"
      CITIZENCHAIN_RUNTIME_TRANSACTION_VERSION: "${{ inputs.transaction_version }}"
      CITIZENCHAIN_RUNTIME_BASE: "${{ inputs.runtime_base }}"
      CITIZENCHAIN_SOURCE_SHA: "${{ inputs.source_sha }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - name: 核对产品候选及准确源码
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const {product}=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const {readFileSync}=await import('node:fs');
          const version=process.env.CITIZENCHAIN_RELEASE_VERSION,transaction=process.env.CITIZENCHAIN_RUNTIME_TRANSACTION_VERSION;
          const base=JSON.parse(process.env.CITIZENCHAIN_RUNTIME_BASE),u32=value=>/^(0|[1-9][0-9]*)$/u.test(value)&&Number(value)<=0xffffffff;
          const frozen=readFileSync(process.env.GITHUB_WORKSPACE+'/runtime/primitives/src/genesis.rs','utf8').match(/pub const GENESIS_HASH:\s*\[u8;\s*32\]\s*=\s*hex_literal::hex!\("([a-f0-9]{64})"\)/u);
          if(context.ref!=='refs/heads/main'||context.sha!==process.env.CITIZENCHAIN_SOURCE_SHA||!u32(version)||!u32(transaction)
            ||!frozen||base.genesisHash!=='0x'+frozen[1]||!/^0x[0-9a-f]{64}$/u.test(base.blockHash)||base.specName!==product.id
            ||!Number.isInteger(base.specVersion)||!Number.isInteger(base.transactionVersion)||base.specVersion<0||base.transactionVersion<0
            ||Number(version)!==base.specVersion+1||Number(transaction)!==base.transactionVersion+1)throw Error('WASM源码、冻结基线或双版本不符');
          const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{...context.repo,workflow_id:product.platforms.wasm.workflow,branch:'main',event:'workflow_dispatch',per_page:100});
          if(runs.some(run=>run.id!==context.runId&&run.status!=='completed'&&run.run_number<(runs.find(row=>row.id===context.runId)?.run_number||0)))throw Error('WASM已有活动编译Run');
          const tag=product.title+'·WASM·v'+version;
          const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});
          if(releases.some(value=>value.tag_name===tag))throw Error('候选正式版本或草稿已存在');
          try{await github.rest.git.getRef({...context.repo,ref:'tags/'+tag});throw Error('候选Tag已存在');}catch(error){if(error.status!==404)throw error;}
          core.info('WASM候选已确认：'+tag);
  build:
    name: 公民链·WASM·v${{ inputs.version }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PLATFORM: wasm
      CITIZENCHAIN_RELEASE_VERSION: "${{ inputs.version }}"
      CITIZENCHAIN_RUNTIME_TRANSACTION_VERSION: "${{ inputs.transaction_version }}"
      CITIZENCHAIN_RUNTIME_BASE: "${{ inputs.runtime_base }}"
      CITIZENCHAIN_SOURCE_SHA: "${{ inputs.source_sha }}"
      CARGO_TARGET_DIR: "${{ github.workspace }}/target/build/wasm/cargo-target"
      CITIZENCHAIN_SOURCE_ROOT: "${{ github.workspace }}"
      CITIZENCHAIN_WORK_DIR: "${{ github.workspace }}/target/build/wasm"
      CARGO_INCREMENTAL: '1'
      npm_config_cache: "${{ github.workspace }}/target/cache/wasm/npm"
    outputs:
      assets: "${{ steps.assets.outputs.assets }}"
      runtime: "${{ steps.assets.outputs.runtime }}"
      version: "${{ steps.assets.outputs.version }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      with:
        toolchain: 1.97.1
        targets: wasm32v1-none
        components: rust-src
    - name: 安装编译依赖与固定 protoc
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y clang llvm llvm-dev libclang-dev libssl-dev pkg-config file unzip
        curl --fail --location --proto =https --proto-redir =https --retry 3 --output "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-linux-x86_64.zip
        mkdir -p "$RUNNER_TEMP/protoc"
        unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
        echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
    - name: 恢复本平台官方增量缓存
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          target/build/wasm/cargo-target/release/.fingerprint
          target/build/wasm/cargo-target/release/build
          target/build/wasm/cargo-target/release/deps
          target/build/wasm/cargo-target/release/incremental
          target/cache/wasm/npm
        key: citizenchain-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/protocol/Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platform/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: 'citizenchain-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'', ''crates/protocol/Cargo.lock'', ''config.toml'', ''crates/scanner/package-lock.json'', ''node/frontend/package-lock.json'', ''onchina/platform/frontend/package-lock.json'') }}-

          '
    - name: 执行产品所属真实测试
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$CITIZENCHAIN_WORK_DIR"
        export NODE="$(node -p process.execPath)" CITIZENCHAIN_BUILD_PLATFORM="$PLATFORM"
        export WASM_BUILD_FROM_SOURCE=1 CITIZENCHAIN_PRODUCTION_WASM_BUILD=1
        unset SKIP_WASM_BUILD WASM_FILE DOCS_RS
        for key in $(compgen -v); do
          case "$key" in APPLE_*|*_TOKEN|*_PASSWORD|*_PRIVATE_KEY|*_SECRET|NODE_OPTIONS|NODE_PATH|NODE_TEST_CONTEXT|SKIP_*_WASM_BUILD) unset "$key" ;; esac
        done
        cargo --config config.toml clean -p runtime --locked
        cargo --config config.toml test --locked --release -p runtime --all-targets
    - name: 编译及核对完整产物
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$CITIZENCHAIN_SOURCE_SHA"
        git diff --quiet HEAD
        node scripts/runtime.mjs build
    - name: 记录实际产物原始字节
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: assets
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const {product}=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const {createReadStream,lstatSync,readdirSync}=await import('node:fs');
          const {createHash}=await import('node:crypto');
          const p=process.env.PLATFORM,version=process.env.CITIZENCHAIN_RELEASE_VERSION,declared=product.platforms[p];
          const names=declared.files||[declared.artifact.replace('{version}',version)];
          const tag=product.title+'·'+declared.name+'·v'+version,directory=process.env.GITHUB_WORKSPACE+'/target/build/'+p+'/artifact';
          if(JSON.stringify(readdirSync(directory).sort())!==JSON.stringify([...names].sort()))throw Error('完整产物集合不符');
          const assets=[];
          for(const name of names){
            const path=directory+'/'+name,info=lstatSync(path);
            if(!info.isFile()||info.isSymbolicLink()||info.size<=0)throw Error('产物不是非空普通文件');
            const hash=createHash('sha256');for await(const bytes of createReadStream(path))hash.update(bytes);
            assets.push({name,label:tag+(p==='wasm'?name.slice('runtime'.length):declared.extension),size:info.size,sha256:hash.digest('hex')});
          }
          core.setOutput('assets',JSON.stringify(assets));
          const base=JSON.parse(process.env.CITIZENCHAIN_RUNTIME_BASE);
          core.setOutput('version',version);
          core.setOutput('runtime',JSON.stringify({source_sha:context.sha,genesis_hash:base.genesisHash,base_block_hash:base.blockHash,spec_name:base.specName,
            base_spec_version:base.specVersion,base_transaction_version:base.transactionVersion,
            spec_version:Number(version),transaction_version:Number(process.env.CITIZENCHAIN_RUNTIME_TRANSACTION_VERSION)}));
    - name: 保存本平台官方增量缓存
      if: success() || failure()
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          target/build/wasm/cargo-target/release/.fingerprint
          target/build/wasm/cargo-target/release/build
          target/build/wasm/cargo-target/release/deps
          target/build/wasm/cargo-target/release/incremental
          target/cache/wasm/npm
        key: citizenchain-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/protocol/Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platform/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: 上传完整Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: 公民链·WASM·v${{ inputs.version }}
        path: target/build/wasm/artifact
        if-no-files-found: error
    - name: 清理本轮编译现场
      if: always()
      shell: bash
      run: node --input-type=module -e "import {cleanWork} from './scripts/runtime.mjs'; cleanWork();"
  release:
    name: 公民链·WASM·v${{ inputs.version }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RUNTIME_BUILD: "${{ needs.build.outputs.runtime }}"
      BUILT_VERSION: "${{ needs.build.outputs.version }}"
      PLATFORM: wasm
      CITIZENCHAIN_RELEASE_VERSION: "${{ inputs.version }}"
      CITIZENCHAIN_RUNTIME_TRANSACTION_VERSION: "${{ inputs.transaction_version }}"
      CITIZENCHAIN_SOURCE_SHA: "${{ inputs.source_sha }}"
      GH_TOKEN: "${{ github.token }}"
      SOURCE_ASSETS: "${{ needs.build.outputs.assets }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: 公民链·WASM·v${{ inputs.version }}
        path: "${{ runner.temp }}/artifact"
    - name: 创建并回读正式Tag与Release
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const {product}=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const {readFileSync,writeFileSync,createReadStream}=await import('node:fs');
          const {createHash}=await import('node:crypto');
          const {execFileSync}=await import('node:child_process');
          const p=process.env.PLATFORM,version=process.env.CITIZENCHAIN_RELEASE_VERSION,declared=product.platforms[p];
          const tag=product.title+'·'+declared.name+'·v'+version,assets=JSON.parse(process.env.SOURCE_ASSETS);
          const names=declared.files||[declared.artifact.replace('{version}',version)],source=process.env.RUNNER_TEMP+'/artifact';
          if(context.sha!==process.env.CITIZENCHAIN_SOURCE_SHA||context.ref!=='refs/heads/main')throw Error('发布源码身份不符');
          if(JSON.stringify(assets.map(asset=>asset.name).sort())!==JSON.stringify([...names].sort()))throw Error('正式产物集合不完整');
          for(const asset of assets){
            const bytes=readFileSync(source+'/'+asset.name),hash=createHash('sha256');
            for await(const chunk of createReadStream(source+'/'+asset.name))hash.update(chunk);
            if(bytes.length!==asset.size||hash.digest('hex')!==asset.sha256)throw Error('正式产物字节不符');
          }
          const proof={schema:1,repository:product.repository,product_id:product.id,platform:p,workflow:'.github/workflows/'+declared.workflow,
            run_id:context.runId,run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),source_sha:context.sha,version,tag,assets};
          if(p==='wasm'){
            const runtime=JSON.parse(process.env.RUNTIME_BUILD);
            if(String(runtime.spec_version)!==version||process.env.BUILT_VERSION!==version||runtime.source_sha!==context.sha)throw Error('WASM实际版本不符');
            proof.runtime=runtime;
          }
          const notes=process.env.RUNNER_TEMP+'/release-notes.txt';writeFileSync(notes,'<!-- automation:'+JSON.stringify(proof)+' -->\n');
          execFileSync('gh',['release','create',tag,...assets.map(asset=>source+'/'+asset.name+'#'+asset.label),
            '--repo',product.repository,'--target',context.sha,'--title',tag,'--notes-file',notes,'--draft','--latest=false'],{stdio:['ignore','pipe','pipe']});
          const drafts=(await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100})).filter(value=>value.tag_name===tag);
          if(drafts.length!==1)throw Error('本轮草稿不唯一');
          const published=drafts[0];
          if(!published.draft||published.prerelease||published.assets.length!==assets.length)throw Error('本轮草稿或附件状态不符');
          for(const asset of published.assets){
            const original=assets.find(value=>value.name===asset.name);
            if(!original||asset.state!=='uploaded'||asset.size!==original.size||asset.digest!=='sha256:'+original.sha256||asset.label!==original.label)throw Error('正式附件回读不符');
          }
          const result=(await github.rest.repos.updateRelease({...context.repo,release_id:published.id,draft:false})).data;
          if(result.draft||result.prerelease||!result.published_at)throw Error('正式Release发布未确认');
          const ref=(await github.rest.git.getRef({...context.repo,ref:'tags/'+tag})).data;
          if(ref.object.type!=='commit'||ref.object.sha!==context.sha)throw Error('正式Tag提交不符');
          core.info('正式交付已确认：'+tag);
  cleanup:
    name: 公民链·WASM·v${{ inputs.version }}
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [prepare, build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      PLATFORM: wasm
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - name: 清理本平台已完成历史
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const {product}=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const p=process.env.PLATFORM,repo=context.repo,workflow=product.platforms[p].workflow;
          const prefix=product.title+'·'+product.platforms[p].name+'·v';
          const rows=()=>github.paginate(github.rest.actions.listWorkflowRuns,{...repo,workflow_id:workflow,branch:'main',per_page:100});
          const terminal=(await rows()).filter(run=>run.id!==context.runId&&run.status==='completed'&&run.path==='.github/workflows/'+workflow);
          const builds=terminal.filter(run=>run.event==='workflow_dispatch').sort((a,b)=>b.run_number-a.run_number||b.id-a.id);
          const keep=new Set([builds.find(run=>run.conclusion==='success')?.id,builds.find(run=>run.conclusion!=='success')?.id]);
          const obsolete=terminal.filter(run=>run.event==='workflow_dispatch'&&!keep.has(run.id)
            ||run.event==='repository_dispatch'&&run.display_title.startsWith(prefix));
          const releases=await github.paginate(github.rest.repos.listReleases,{...repo,per_page:100});
          for(const old of obsolete){
            const current=(await github.rest.actions.getWorkflowRun({...repo,run_id:old.id})).data;
            if(current.status!=='completed'||current.head_sha!==old.head_sha||current.run_attempt!==old.run_attempt||current.conclusion!==old.conclusion)throw Error('旧Run终态变化，停止删除');
            for(const release of releases.filter(value=>value.tag_name.startsWith(prefix))){
              const lines=String(release.body||'').split(/\r?\n/u).filter(line=>line.startsWith('<!-- automation:')&&line.endsWith(' -->'));
              if(lines.length!==1)continue;
              const proof=JSON.parse(lines[0].slice(16,-4));
              if(proof.run_id!==old.id)continue;
              if(proof.source_sha!==old.head_sha||release.target_commitish!==old.head_sha||proof.tag!==release.tag_name)throw Error('旧Release归属不符');
              try{
                const tag=(await github.rest.git.getRef({...repo,ref:'tags/'+release.tag_name})).data;
                if(tag.object.type!=='commit'||tag.object.sha!==old.head_sha)throw Error('旧Tag提交变化');
                await github.rest.git.deleteRef({...repo,ref:'tags/'+release.tag_name});
              }catch(error){if(error.status!==404)throw error;}
              await github.rest.repos.deleteRelease({...repo,release_id:release.id});
            }
            await github.rest.actions.deleteWorkflowRun({...repo,run_id:old.id});
            try{await github.rest.actions.getWorkflowRun({...repo,run_id:old.id});throw Error('旧Run删除未确认');}catch(error){if(error.status!==404)throw error;}
          }
          const remaining=await rows();
          if(obsolete.some(old=>remaining.some(run=>run.id===old.id)))throw Error('历史删除回读未通过');
          await core.summary.addHeading('已完成历史清理').addRaw('仅按真实已完成结果保留最近成功、最近非成功；活动Run保持。当前Run尚未终态，严格最终两条尚未确认。').write();
