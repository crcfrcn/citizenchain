# WASM的GitHub任务归本工作流；编译只调用产品Runtime入口。
name: 公民链·WASM
run-name: 公民链·WASM·v${{ inputs.version }}
'on':
  workflow_dispatch:
    inputs:
      version: {description: '读取链上spec_version后加1的目标整数版本', required: true, type: string}
      transaction_version: {description: '读取链上transaction_version后加1的目标整数版本', required: true, type: string}
      runtime_base: {description: '本机节点读取的Runtime基线JSON，仅属于本轮任务', required: true, type: string}
      source_sha: {description: '批准的main完整提交', required: true, type: string}
concurrency:
  group: "${{ github.repository }}-wasm-${{ github.event_name }}"
  cancel-in-progress: false
permissions: {contents: read, actions: read}
defaults: {run: {shell: bash}}
env:
  PLATFORM: wasm
  CITIZENCHAIN_RELEASE_VERSION: "${{ inputs.version }}"
  CITIZENCHAIN_RUNTIME_TRANSACTION_VERSION: "${{ inputs.transaction_version }}"
  CITIZENCHAIN_RUNTIME_BASE: "${{ inputs.runtime_base }}"
  CITIZENCHAIN_SOURCE_SHA: "${{ inputs.source_sha }}"
jobs:
  prepare:
    name: 公民链·WASM·v${{ inputs.version }}
    permissions: {contents: write, actions: read}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with: {ref: "${{ github.sha }}", persist-credentials: false}
    - name: 核对产品候选及准确源码
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        retries: 0
        script: |
          const {wasmVersion}=await import(require('node:url').pathToFileURL(process.env.GITHUB_WORKSPACE+'/.github/release.mjs').href);
          await wasmVersion({context,github,core});
  build:
    name: 公民链·WASM·v${{ inputs.version }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_TARGET_DIR: "${{ github.workspace }}/target/build/wasm/cargo-target"
      CITIZENCHAIN_SOURCE_ROOT: "${{ github.workspace }}"
      CITIZENCHAIN_WORK_DIR: "${{ github.workspace }}/target/build/wasm"
      CARGO_INCREMENTAL: '1'
      npm_config_cache: "${{ github.workspace }}/target/cache/wasm/npm"
    outputs:
      assets: "${{ steps.assets.outputs.assets }}"
      runtime: "${{ steps.assets.outputs.runtime }}"
      version: "${{ steps.assets.outputs.version }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with: {ref: "${{ github.sha }}", persist-credentials: false}
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with: {node-version: '25.2.1'}
    - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      with: {toolchain: '1.97.1', targets: 'wasm32v1-none', components: rust-src}
    - name: 安装编译依赖与固定 protoc
      run: node --input-type=module -e "import {prepareTools} from './.github/release.mjs'; await prepareTools()"
    - name: 恢复本平台官方增量缓存
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: &cachePaths |
          target/build/wasm/cargo-target/release/.fingerprint
          target/build/wasm/cargo-target/release/build
          target/build/wasm/cargo-target/release/deps
          target/build/wasm/cargo-target/release/incremental
          target/cache/wasm/npm
        key: &cacheKey citizenchain-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/protocol/Cargo.lock', 'config.toml', 'crates/scanner/package-lock.json', 'node/frontend/package-lock.json', 'onchina/platformweb/package-lock.json', 'onchina/registryweb/package-lock.json', 'onchina/legislationweb/package-lock.json', 'onchina/private/frontend/package-lock.json', 'onchina/judicial/frontend/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: 'citizenchain-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'', ''crates/protocol/Cargo.lock'', ''config.toml'', ''crates/scanner/package-lock.json'', ''node/frontend/package-lock.json'', ''onchina/platformweb/package-lock.json'', ''onchina/registryweb/package-lock.json'', ''onchina/legislationweb/package-lock.json'', ''onchina/private/frontend/package-lock.json'', ''onchina/judicial/frontend/package-lock.json'') }}-'
    - name: 执行产品所属真实测试
      run: node --input-type=module -e "import {test} from './.github/release.mjs'; await test()"
    - name: 编译、执行整链验收及核对完整产物
      id: runtime
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$CITIZENCHAIN_SOURCE_SHA"
        git diff --quiet HEAD
        node scripts/runtime.mjs build
    - name: 记录实际产物原始字节
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: assets
      with:
        retries: 0
        script: |
          const {recordAssets}=await import(require('node:url').pathToFileURL(process.env.GITHUB_WORKSPACE+'/.github/release.mjs').href);
          await recordAssets({context,core});
    - name: 保存本平台官方增量缓存
      if: success() || failure()
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: *cachePaths
        key: *cacheKey
    - name: 上传完整Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with: {name: "公民链·WASM·v${{ inputs.version }}", path: "target/build/wasm/artifact", if-no-files-found: error}
    - name: 清理本轮编译现场
      if: always()
      run: node --input-type=module -e "import {cleanWork} from './scripts/runtime.mjs'; cleanWork();"
  release:
    name: 公民链·WASM·v${{ inputs.version }}
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    env:
      RUNTIME_BUILD: "${{ needs.build.outputs.runtime }}"
      BUILT_VERSION: "${{ needs.build.outputs.version }}"
      GH_TOKEN: "${{ github.token }}"
      SOURCE_ASSETS: "${{ needs.build.outputs.assets }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with: {ref: "${{ github.sha }}", persist-credentials: false}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with: {name: "公民链·WASM·v${{ inputs.version }}", path: "${{ runner.temp }}/artifact"}
    - name: 创建并回读正式Tag与Release
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        retries: 0
        script: |
          const {publish}=await import(require('node:url').pathToFileURL(process.env.GITHUB_WORKSPACE+'/.github/release.mjs').href);
          await publish({context,github,core});
  # 必须保留最近成功1条、失败1条；修复验收后禁止改动。
  cleanup:
    name: 公民链·WASM·v${{ inputs.version }}
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [prepare, build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      PLATFORM: wasm
      JOB_RESULTS: '{"prepare":"${{ needs.prepare.result }}","build":"${{ needs.build.result }}","release":"${{ needs.release.result }}"}'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - name: 清理本平台已完成历史
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        retries: 0
        script: |
          const {pathToFileURL}=await import('node:url');
          const {product}=await import(pathToFileURL(process.env.GITHUB_WORKSPACE+'/scripts/config.mjs').href);
          const p=process.env.PLATFORM,repo=context.repo,workflow=product.platforms[p].workflow;
          const prefix=product.title+'·'+product.platforms[p].name+'·v';
          const rows=()=>github.paginate(github.rest.actions.listWorkflowRuns,{...repo,workflow_id:workflow,branch:'main',per_page:100});
          const results=JSON.parse(process.env.JOB_RESULTS);
          if(Object.keys(results).sort().join(',')!=='build,prepare,release'
            ||Object.values(results).some(value=>!['success','failure','skipped','cancelled'].includes(value)))throw Error('本轮前置作业结果无效');
          const current=(await github.rest.actions.getWorkflowRun({...repo,run_id:context.runId})).data;
          if(current.path!=='.github/workflows/'+workflow||current.event!=='workflow_dispatch'||current.head_branch!=='main'
            ||current.head_sha!==context.sha||current.run_attempt!==Number(process.env.GITHUB_RUN_ATTEMPT))throw Error('本轮Run身份变化');
          const terminal=(await rows()).filter(run=>run.id!==context.runId&&run.status==='completed'&&run.path==='.github/workflows/'+workflow);
          // 本轮占用对应保留名额，避免结束后出现第三条；只读取已结束作业，不伪造或写入GitHub最终conclusion。
          const ownResult=Object.values(results).every(value=>value==='success')?'success':'failure';
          const result=run=>run.id===context.runId&&run.status!=='completed'?ownResult:run.conclusion==='success'?'success':'failure';
          const builds=[...terminal.filter(run=>run.event==='workflow_dispatch'),current].sort((a,b)=>b.run_number-a.run_number||b.id-a.id);
          const keep=new Set([builds.find(run=>result(run)==='success')?.id,builds.find(run=>result(run)==='failure')?.id]);
          const obsolete=terminal.filter(run=>run.event==='workflow_dispatch'&&!keep.has(run.id)
            ||run.event==='repository_dispatch'&&run.display_title.startsWith(prefix));
          const releases=await github.paginate(github.rest.repos.listReleases,{...repo,per_page:100});
          for(const old of obsolete){
            const current=(await github.rest.actions.getWorkflowRun({...repo,run_id:old.id})).data;
            if(current.status!=='completed'||current.head_sha!==old.head_sha||current.run_attempt!==old.run_attempt||current.conclusion!==old.conclusion)throw Error('旧Run终态变化，停止删除');
            for(const release of releases.filter(value=>value.tag_name.startsWith(prefix))){
              const lines=String(release.body||'').split(/\r?\n/u).filter(line=>line.startsWith('<!-- automation:')&&line.endsWith(' -->'));
              if(lines.length!==1)continue;
              const proof=JSON.parse(lines[0].slice(16,-4));
              if(proof.run_id!==old.id)continue;
              if(proof.source_sha!==old.head_sha||release.target_commitish!==old.head_sha||proof.tag!==release.tag_name)throw Error('旧Release归属不符');
              try{
                const tag=(await github.rest.git.getRef({...repo,ref:'tags/'+release.tag_name})).data;
                if(tag.object.type!=='commit'||tag.object.sha!==old.head_sha)throw Error('旧Tag提交变化');
                await github.rest.git.deleteRef({...repo,ref:'tags/'+release.tag_name});
              }catch(error){if(error.status!==404)throw error;}
              await github.rest.repos.deleteRelease({...repo,release_id:release.id});
            }
            await github.rest.actions.deleteWorkflowRun({...repo,run_id:old.id});
            try{await github.rest.actions.getWorkflowRun({...repo,run_id:old.id});throw Error('旧Run删除未确认');}catch(error){if(error.status!==404)throw error;}
          }
          const remaining=await rows();
          if(obsolete.some(old=>remaining.some(run=>run.id===old.id)))throw Error('历史删除回读未通过');
          const retained=remaining.filter(run=>run.path==='.github/workflows/'+workflow&&run.event==='workflow_dispatch'
            &&(run.status==='completed'||run.id===context.runId));
          if(['success','failure'].some(state=>retained.filter(run=>result(run)===state).length>1))throw Error('成功失败各一条回读未通过');
          await core.summary.addHeading('已完成历史清理').addRaw('已将本轮作业结果计入保留名额，最近成功1条、失败1条；删除已回读，其他活动Run保持。本轮最终conclusion由GitHub在Job结束后确定。').write();
