name: "公民链·WASM"
run-name: "公民链·WASM·v${{ inputs.version }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: 产品确定的本次版本
        required: true
        type: string
      version_plan:
        description: 产品确定的版本与源码计划
        required: true
        type: string
concurrency:
  group: "${{ github.repository }}-wasm"
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  release:
    name: "公民链·WASM·v${{ inputs.version }}"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CITIZENCHAIN_RELEASE_VERSION: "${{ inputs.version }}"
      CITIZENCHAIN_VERSION_PLAN: "${{ inputs.version_plan }}"
      GH_TOKEN: "${{ github.token }}"
      CARGO_INCREMENTAL: '1'
      WASM_BUILD_FROM_SOURCE: '1'
      CITIZENCHAIN_PRODUCTION_WASM_BUILD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 准备本次 Runner 独占现场
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_HOME=$RUNNER_TEMP/citizenchain-wasm-cargo" >> "$GITHUB_ENV"
          echo "RELEASE_ASSETS_DIR=$GITHUB_WORKSPACE/target/build/wasm" >> "$GITHUB_ENV"
      - name: 核对本产品派发版本和源码计划
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs ci-version wasm
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          targets: wasm32v1-none
          components: rust-src
      - name: 安装编译依赖与固定 protoc
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm llvm-dev libclang-dev libssl-dev pkg-config file unzip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-linux-x86_64.zip
          echo 'a45cda0989c17dd950db55f6fbe1e5814c50fda08e87aa422980ac1f89dddbbc  '"$RUNNER_TEMP/protoc.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
      - name: 恢复WASM独立增量缓存
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/cache/wasm
          key: citizenchain-cargo-v1-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'config.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citizenchain-cargo-v1-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'config.toml') }}-
      - name: 校验与编译正式 WASM
        shell: bash
        run: |
          set -euo pipefail
          cargo --config "$GITHUB_WORKSPACE/config.toml" metadata --locked --no-deps --format-version 1 >/dev/null
          node scripts/build.mjs ci-build wasm > "$RUNNER_TEMP/citizenchain-wasm-build-result.json"
      - name: 验真WASM增量缓存
        if: success() || failure()
        id: cache_ready
        shell: bash
        run: |
          set -euo pipefail
          ready="$(node scripts/build.mjs ci-cache-ready wasm)"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: 保存WASM独立增量缓存
        if: (success() || failure()) && steps.cache_ready.outputs.ready == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/cache/wasm
          key: citizenchain-cargo-v1-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'config.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 创建并回读正式 WASM GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          plan="$GITHUB_WORKSPACE/target/build/wasm/release-plan.json"
          tag="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.tag)' "$plan")"
          notes="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.notes)' "$plan")"
          title="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.title)' "$plan")"
          file="$GITHUB_WORKSPACE/target/build/wasm/citizenchain.compact.compressed.wasm"
          test -s "$file" && test "$(wc -c < "$file")" -le 5242880
          upload_arguments="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.uploads.join("\n"))' "$plan")"
          uploads=()
          while IFS= read -r item; do uploads+=("$item"); done <<< "$upload_arguments"
          gh release create "$tag" "${uploads[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --draft --latest=false
          node scripts/build.mjs ci-verify-release wasm draft
      - name: 清理本平台编译现场
        if: always()
        shell: bash
        run: node scripts/build.mjs finish wasm
