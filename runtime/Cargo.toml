[package]
# 根tests统一存放单元测试，独立集成目标仅显式注册，避免重复发现。
autotests = false
name = "runtime"  # 运行时状态模块
description = "CitizenChain runtime built with Substrate."
homepage.workspace = true
publish = false
edition.workspace = true   # 默认 Rust 版本
version.workspace = true   # 版本号
authors.workspace = true   # 作者
repository.workspace = true  #项目仓库
license = "MIT"        # 授权协议 MIT

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive", "serde"], workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false }
hex-literal = "0.4"
primitives = { path = "primitives", default-features = false } # 引用统一常量

# frame
frame-executive = { workspace = true }
frame-metadata-hash-extension = { workspace = true }
frame-support = { features = ["experimental"], workspace = true }
frame-system = { workspace = true }
frame-try-runtime = { optional = true, workspace = true }

# frame pallets
pallet-assets = { workspace = true }
pallet-balances = { workspace = true }
pallet-grandpa = { workspace = true }
# 与工作空间固定的SDK提交统一，提供已注册的官方Ethereum执行模块。
pallet-revive = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-transaction-payment = { workspace = true }

# primitives
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-consensus-pow = { workspace = true }
sp-consensus-grandpa = { workspace = true }
sp-core = { features = ["serde"], workspace = true }
sp-genesis-builder = { workspace = true }
sp-inherents = { workspace = true }
sp-io = { workspace = true }
sp-offchain = { workspace = true }
sp-runtime = { features = ["serde"], workspace = true }
sp-session = { workspace = true }
sp-storage = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { features = ["serde"], workspace = true }

# RPC related
frame-system-rpc-runtime-api = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }

# Used for runtime benchmarking
frame-benchmarking = { optional = true, workspace = true }
frame-system-benchmarking = { optional = true, workspace = true }

prbbankissue = { path = "issuance/prbbankissue", default-features = false }
fullnodeissue = { path = "issuance/fullnodeissue", default-features = false }
citizenissue = { path = "issuance/citizenissue", default-features = false }
onchainissue = { path = "issuance/onchainissue", default-features = false }
identity = { path = "misc/identity", default-features = false }
difficulty = { path = "misc/difficulty", default-features = false }
address = { path = "misc/address", default-features = false }
square = { path = "misc/square", default-features = false }
onchain = { path = "transaction/onchain", default-features = false }
entitybase = { path = "entity/entitybase", default-features = false }
publicentity = { path = "entity/publicentity", default-features = false }
privateentity = { path = "entity/privateentity", default-features = false }
personalentity = { path = "entity/personalentity", default-features = false }
personaladmin = { path = "admins/personaladmin", default-features = false }
resolutionissue = { path = "issuance/resolutionissue", default-features = false }
votebase = { path = "votingengine/votebase", default-features = false }
internalvote = { path = "votingengine/internalvote", default-features = false }
jointvote = { path = "votingengine/jointvote", default-features = false }
electionvote = { path = "votingengine/electionvote", default-features = false }
legislationvote = { path = "votingengine/legislationvote", default-features = false }
adminbase = { path = "admins/adminbase", default-features = false }
publicadmin = { path = "admins/publicadmin", default-features = false }
privateadmin = { path = "admins/privateadmin", default-features = false }
grandpakey = { path = "governance/grandpakey", default-features = false }
upgrade = { path = "governance/upgrade", default-features = false }
legislation = { path = "public/legislation", default-features = false }
election = { path = "public/election", default-features = false }
destroy = { path = "governance/destroy", default-features = false }
multisig = { path = "transaction/multisig", default-features = false }
offchain = { path = "transaction/offchain", default-features = false }
genesis = { path = "genesis", default-features = false }

[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

