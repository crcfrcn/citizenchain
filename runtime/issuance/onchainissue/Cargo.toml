[package]
# 测试源统一归tests；独立目标只显式注册，避免重复发现。
autotests = false
name = "onchainissue"  # 链上发行代币模块(Plain FT)
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT"

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
pallet-balances = { workspace = true }
pallet-assets = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
sp-io = { workspace = true }
votebase = { path = "../../votingengine/votebase", default-features = false }
primitives = { path = "../../primitives", default-features = false }
entitybase = { path = "../../entity/entitybase", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-balances/std",
    "pallet-assets/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-io/std",
    "votebase/std",
    "primitives/std",
    "entitybase/std",
]
runtime-benchmarks = [
    # 基准特性向既有依赖传播；当前未实现业务不登记可执行基准。
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
    "pallet-assets/runtime-benchmarks",
    "votebase/runtime-benchmarks",
]
try-runtime = [
    # try-runtime feature 必须传播给所有 frame / pallet 依赖,
    # 否则 root runtime 启用 try-runtime 时编译会失败（ADR-011 修订项 #6）。
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-balances/try-runtime",
    "pallet-assets/try-runtime",
    "votebase/try-runtime",
    "sp-runtime/try-runtime",
]

[dev-dependencies]
internalvote = { path = "../../votingengine/internalvote", default-features = false }
jointvote = { path = "../../votingengine/jointvote", default-features = false }
