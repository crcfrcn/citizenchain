[package]
# 测试源统一归tests；独立目标只显式注册，避免重复发现。
autotests = false
name = "adminbase"
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT"

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
frame-support = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }

primitives = { path = "../../primitives", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "sp-runtime/std",
    "sp-std/std",
    "primitives/std",
]
try-runtime = []
runtime-benchmarks = []

# 库入口归src，模块按真实职责平铺，测试唯一归同级tests。
[lib]
path = "src/lib.rs"
