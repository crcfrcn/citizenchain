sp-std = { workspace = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "sp-runtime/std",
    "primitives/std",
    "adminbase/std",
    "sp-std/std",
]
