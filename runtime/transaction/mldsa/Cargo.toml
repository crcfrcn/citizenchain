[package]
name = "mldsa"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "CitizenChain ML-DSA-65 primitives and optional FRAME transaction authentication"
autotests = false

[dependencies]
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
blake2 = { version = "=0.10.6", default-features = false }
hkdf = { version = "=0.12.4", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
genesis = { path = "../../genesis", default-features = false, optional = true }
frame-support = { workspace = true, optional = true }
frame-system = { workspace = true, optional = true }
sp-runtime = { workspace = true, optional = true }
sp-core = { workspace = true, optional = true }
sp-io = { workspace = true, optional = true }

[features]
default = []
std = ["genesis?/std", "codec/std", "scale-info/std", "frame-support?/std", "frame-system?/std", "sp-runtime?/std", "sp-core?/std", "sp-io?/std"]
signing = []
ffi = ["std", "signing"]
runtime = ["dep:genesis", "dep:frame-support", "dep:frame-system", "dep:sp-runtime", "dep:sp-core", "dep:sp-io"]
operation = ["runtime"]
pq-only = ["signing"]
runtime-benchmarks = ["runtime", "signing", "frame-support/runtime-benchmarks", "frame-system/runtime-benchmarks"]
try-runtime = ["runtime", "frame-support/try-runtime", "frame-system/try-runtime"]

[[test]]
name = "crypto"
path = "tests/crypto.rs"
required-features = ["signing"]

# 真实运行时夹具与互操作样例均由本模块登记和构建。
[dev-dependencies]
runtime = { path = "../..", default-features = true }
chain-signing = { path = "../../../crates/signing" }
onchain = { path = "../onchain", default-features = true }
identity = { path = "../../misc/identity", default-features = true }
primitives = { path = "../../primitives", default-features = true }
frame-metadata-hash-extension = { workspace = true, default-features = true }
pallet-transaction-payment = { workspace = true, default-features = true }
pallet-timestamp = { workspace = true, default-features = true }
hex = "=0.4.3"
serde_json = { workspace = true, default-features = true }

[[test]]
name = "runtime_flow"
path = "tests/runtime.rs"
required-features = ["runtime", "signing", "std"]

[[example]]
name = "mldsa_interop"
path = "tests/interop.rs"
required-features = ["runtime", "signing", "std"]
