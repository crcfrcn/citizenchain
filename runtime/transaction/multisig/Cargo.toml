[package]
# 根tests统一存放单元测试，独立集成目标仅显式注册，避免重复发现。
autotests = false
name = "multisig"  # 多签名地址转账模块
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT"

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
pallet-balances = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-io = { workspace = true }

primitives = { path = "../../primitives", default-features = false }
votebase = { path = "../../votingengine/votebase", default-features = false }
entitybase = { path = "../../entity/entitybase", default-features = false }
publicentity = { path = "../../entity/publicentity", default-features = false }
privateentity = { path = "../../entity/privateentity", default-features = false }
personalentity = { path = "../../entity/personalentity", default-features = false }
onchain = { path = "../onchain", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-balances/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-io/std",
    "primitives/std",
    "votebase/std",
    "entitybase/std",
    "publicentity/std",
    "privateentity/std",
    "personalentity/std",
    "onchain/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = []

[dev-dependencies]
adminbase = { path = "../../admins/adminbase", default-features = true }
publicadmin = { path = "../../admins/publicadmin", default-features = true }
privateadmin = { path = "../../admins/privateadmin", default-features = true }
personaladmin = { path = "../../admins/personaladmin", default-features = true }
internalvote = { path = "../../votingengine/internalvote", default-features = false }
