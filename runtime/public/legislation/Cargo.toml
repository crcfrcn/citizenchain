[package]
# 根tests统一存放单元测试，独立集成目标仅显式注册，避免重复发现。
autotests = false
name = "legislation"  # 立法院模块:法律结构化上链 + 修法走投票引擎(ADR-027)
edition.workspace = true   # 默认 Rust 版本
version.workspace = true   # 版本号
authors.workspace = true   # 作者
repository.workspace = true  # 项目仓库
license = "MIT"        # 授权协议 MIT

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-timestamp = { workspace = true }
sp-runtime = { workspace = true }
sp-io = { workspace = true }

primitives = { path = "../../primitives", default-features = false }
votebase = { path = "../../votingengine/votebase", default-features = false }
legislationvote = { path = "../../votingengine/legislationvote", default-features = false }
entitybase = { path = "../../entity/entitybase", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-timestamp/std",
    "sp-runtime/std",
    "sp-io/std",
    "primitives/std",
    "votebase/std",
    "legislationvote/std",
    "entitybase/std",
]
try-runtime = []

[dev-dependencies]
# 测试 mock 需要 std;internalvote 仅为投票引擎 finalizer 装配,使用其默认(std)特性。
internalvote = { path = "../../votingengine/internalvote" }
