[package]
name = "onchina"
description = "onchina:链上中国多机构统一控制台(CID 身份 + 链下明细 + 管理员鉴权 + 颁发),经节点 RPC 读写链。"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license = "MIT"
publish = false
autotests = false

# 公共库与宿主共享同一实现，业务包通过路径依赖链接。
[lib]
path = "modules/lib.rs"

[[bin]]
name = "onchina"
path = "modules/main.rs"

[features]
# 仅业务包开发依赖启用；正式构建不得包含测试工厂。
test-support = []

[package.metadata.onchina]
# 唯一工程配对声明；前端自有npm声明、锁与公开exports。
frontend = "../platformweb"

[lints]
workspace = true

[dependencies]
# Web服务与三仓第一方服务统一使用axum 0.8。
axum = { version = "=0.8.9", features = ["multipart"] }
# 固定局域网入口使用公信 HTTPS；ACME 协议和系统密钥存储交由标准库。
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "pem", "x509-parser"] }
instant-acme = { version = "=0.8.5", default-features = false, features = ["ring"] }
keyring = "=4.2.0"
# 首次办证授权在主机终端隐藏输入，只写入系统密钥库。
rpassword = "=7.5.4"
# ACME 复用本产品严格 HTTPS 客户端；不引入另一套代理或网络策略。
bytes = "1"
http-body-util = "0.1"
webpki-roots = "1"
zeroize = "=1.9.0"
x509-parser = { version = "0.16", default-features = false, features = ["verify"] }
time = "0.3"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5"] }
hex = "=0.4.3"
base64 = "=0.22.1"
bs58 = "=0.5.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 链下库:内嵌 PostgreSQL + 行政区 SQLite 单源(china.sqlite)
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# 加解密 / 编码 / 哈希
blake2 = "=0.10.6"
sha2 = "=0.10.9"
schnorrkel = "=0.11.5"
twox-hash = "=2.1.4"

# 链交互:subxt 经节点 RPC 读写链 + reqwest 直连 HTTP RPC
subxt = { version = "0.43.1", default-features = false, features = ["jsonrpsee", "native"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }

# 杂项
libc = "0.2"
dashmap = "6.1"
async-trait = "=0.1.92"

# 链上共享原语（随 workspace 统一固定到已发布的 Polkadot SDK commit）
chain-signing = { path = "../../crates/signing" }
qr-protocol = { path = "../../crates/protocol" } # 仓库级 QR_V1 协议真源
sp-core = { workspace = true, default-features = true }
sp-crypto-hashing = { workspace = true, default-features = true }
primitives = { path = "../../runtime/primitives" }
# 链交易组装+提交(D7):与 node 端同一套 runtime 类型拼 SignedPayload/UncheckedExtrinsic
runtime = { workspace = true, default-features = true }
frame-system = { workspace = true, default-features = true }
codec = { workspace = true, default-features = true }
adminbase = { path = "../../runtime/admins/adminbase" }
entitybase = { path = "../../runtime/entity/entitybase" }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
# 复用原锁的 Tower，以实际分发请求验证路由、鉴权与上传限制。
tower = { version = "=0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
# 仅供立法 call-data 编码器交叉校验测试:用链端真实 Tier/VoteType
# .encode() 比对,锁死 legislation SCALE 不漂移。
legislation = { path = "../../runtime/public/legislation" }
frame-support = { workspace = true, default-features = true }
