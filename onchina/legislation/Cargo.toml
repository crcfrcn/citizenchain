[package]
name = "onchina-legislation"
description = "链上中国legislation独立业务模块"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license = "MIT"
publish = false
autotests = false

[[bin]]
name = "onchina-legislation"
path = "workspace/main.rs"

[package.metadata.onchina]
# 唯一工程配对声明；前端自有npm声明、锁与公开exports。
frontend = "../legislationweb"

[lints]
workspace = true

[dependencies]
onchina = { path = "../platform" }
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5"] }
hex = "=0.4.3"
tracing = "0.1"
subxt = { version = "0.43.1", default-features = false, features = ["jsonrpsee", "native"] }
async-trait = "=0.1.92"
primitives = { path = "../../runtime/primitives" }
codec = { workspace = true, default-features = true }
entitybase = { path = "../../runtime/entity/entitybase" }

[dev-dependencies]
# 仅开发测试链接所属公共辅助，正式包不启用测试特性。
onchina = { path = "../platform", features = ["test-support"] }
legislation = { path = "../../runtime/public/legislation" }
tower = { version = "=0.5.3", features = ["util"] }
