# QR_V1 action registry 唯一代码真源。
# 任何新增扫码签名动作必须先登记在这里，再生成或校验各端产物。

- action_key: login
  action_code: 1
  action_label_zh: 登录确认
  kind: offchain_sign
  qr_kind: sign_request
  pallet:
  call:
  decoder: login
  hash_only_allowed: false
  signing_category: offchain_auth
  required_fields:
    - system

- action_key: citizen_identity
  action_code: 2
  action_label_zh: 公民签名确认
  kind: offchain_sign
  qr_kind: sign_request
  pallet:
  call:
  decoder: citizen_identity
  hash_only_allowed: false
  signing_category: citizen_identity
  required_fields:
    - cid_number
    - account_id
    - valid_range
    - citizen_status
    - residence

# 注册局代办首次绑定——公民钱包解析完整授权模板，把自选 account_id 填入零槽后签名。
- action_key: citizen_occupy
  action_code: 10
  action_label_zh: 注册局占号绑定确认
  kind: offchain_sign
  qr_kind: sign_request
  pallet:
  call:
  decoder: citizen_occupy
  hash_only_allowed: false
  signing_category: citizen_occupy
  required_fields:
    - genesis_hash
    - cid_number
    - expected_binding_revision
    - expires_at

# 注册局代办换绑钱包——新钱包解析锁定当前账户/revision/过期时间的完整授权模板。
- action_key: citizen_rebind
  action_code: 11
  action_label_zh: 注册局换绑账户确认
  kind: offchain_sign
  qr_kind: sign_request
  pallet:
  call:
  decoder: citizen_rebind
  hash_only_allowed: false
  signing_category: citizen_rebind
  required_fields:
    - genesis_hash
    - cid_number
    - current_account_id
    - expected_binding_revision
    - expires_at

# 本机默认账户切换——变化前的原默认账户签署完整目标账户顺序。
# 该动作只授权本机用户切换，不包含 CID 或绑定版本，也不得进入任何换绑流程。
- action_key: switch_default_account
  action_code: 12
  action_label_zh: 切换默认账户
  kind: offchain_sign
  qr_kind: sign_request
  pallet:
  call:
  decoder: switch_default_account
  hash_only_allowed: false
  signing_category: switch_default_account
  required_fields:
    - genesis_hash
    - current_default_account_id
    - new_default_account_id
    - account_count
    - expires_at

# 当前 CID 的 P-256 设备子钥登记——冷账户在 CitizenWallet 上签现有 0x1C 绑定域。
# 热账户仍由 CitizenApp 本机签；两种方式的签名字节完全一致，不新增 runtime 域。
- action_key: square_device_bind
  action_code: 13
  action_label_zh: 设备子钥绑定
  kind: offchain_sign
  qr_kind: sign_request
  pallet:
  call:
  decoder: square_device_bind
  hash_only_allowed: false
  signing_category: square_device_bind
  required_fields:
    - cid_number
    - binding_revision
    - account_id
    - device_public_key
    - issued_at

# 冷账户为 CitizenApp 提供当前 CID 绑定版本的数据用途钥。请求只携带一次性接收
# 公钥与用途编号；CitizenWallet 返回独立 k=6 加密响应，不把用途钥放进签名响应。
- action_key: account_data_key_provision
  action_code: 14
  action_label_zh: 账户数据用途钥提供
  kind: offchain_sign
  qr_kind: sign_request
  pallet:
  call:
  decoder: account_data_key_provision
  hash_only_allowed: false
  signing_category: account_data_key_provision
  required_fields:
    - genesis_hash
    - cid_number
    - binding_revision
    - account_id
    - recipient_public_key
    - key_purposes
    - expires_at

# 产品正式发布授权——冷钱包审阅并签署精确产品、平台、Release、产物摘要、
# 回滚锚点和短时随机挑战。该签名只授权一次本机发布，不向平台发送钱包信息。
# 产品端是产品语义，不是供应商名。闭集固定为 citizenapp/ios|android、
# citizenwallet/ios|android、citizenserve/cloudflare、citizenweb/web、
# tuyulove/ios|android、tuyuserve/cloudflare、tuyuweb/web、
# tuyubooking/macos|linux|windows；钱包必须拒绝其它交叉组合。
- action_key: publish
  action_code: 15
  action_label_zh: 生产发布授权
  kind: offchain_sign
  qr_kind: sign_request
  pallet:
  call:
  decoder: publish
  hash_only_allowed: false
  signing_category: publish
  required_fields:
    - product_id
    - platform
    - version_tag
    - source_sha
    - artifact_sha256
    - previous_deployment_id
    - expires_at
    - nonce

