[package]
name = "blockchain-harness"
description = "CitizenChain blockchain acceptance and malicious block test harness utilities."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# 入口直接归属 crate/src，避免单文件包装目录；公开 crate/命令名称不变。
[[bin]]
name = "harness"
path = "src/harness.rs"

[dependencies]
chain-signing = { path = "../signing" }
clap = { workspace = true }
hex = "=0.4.3"
serde_json = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
