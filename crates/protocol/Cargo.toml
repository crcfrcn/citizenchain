[package]
name = "qr-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

# 入口直接归属 crate/src，避免单文件包装目录；公开 crate/命令名称不变。
[[bin]]
name = "export_registry"
path = "src/export_registry.rs"

[dependencies]
base64 = "=0.22.1"
hex = "=0.4.3"
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true

[lints]
workspace = true

[workspace]         # 公民链QR协议工具的独立Cargo工作空间
members = [
    ".",       # QR_V1 协议、registry、生成器与跨端守卫唯一真源
]
# QR协议工具继续拥有独立workspace与原锁文件；不改变节点、Runtime及OnChina工作空间，
# 禁止把其他产品或链内路径依赖自动吸入本workspace后错误继承package元数据。
resolver = "2"      # 使用 Cargo 新版依赖解析器，减少 feature 冲突

[workspace.package]                                                 # 元信息（作为整个仓库的默认元数据）
edition = "2021"                                                    # Rust 版本规范（2021 Edition）
version = "1.0.0"                                                   # 整个工作空间的统一版本号（子 crate 可继承或覆盖）
authors = ["VoyagerRhett <chinanation@icloud.com>"]                # 作者信息
repository = "https://github.com/crcfrcn/citizenchain"                   # 项目仓库地址
homepage = "https://github.com/crcfrcn/citizenchain"                     # 项目主页
license = "MIT"                                                     # 开源协议

[workspace.lints.rust]                                              # 仓库级共享 Rust crate 统一规则
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# 独立协议工具只声明实际继承的三项依赖，不复制节点或Runtime的依赖目录。
serde      = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
thiserror  = { version = "=2.0.20" }
